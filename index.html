
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:"MS UI Gothic","MS Gothic",monospace;font-size:14px;}

.desktop-screen{
  display:none;
  height:100vh;
  background: linear-gradient(to bottom,#87cefa,#b0e0ff,#e0ffff);
}

/* アイコン */
.desktop{position:absolute;top:10px;left:10px;}
.icon{width:80px;text-align:center;color:white;margin-bottom:20px;cursor:pointer;}

/* ウィンドウ */
.window{
  position:absolute;
  width:340px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  display:none;
  box-shadow:inset -2px -2px #000, inset 2px 2px #fff;
}

.titlebar{
  background:linear-gradient(to right,#000080,#1084d0);
  color:white;
  padding:4px;
  display:flex;
  justify-content:space-between;
  cursor:move;
}

.content{padding:10px;height:300px;overflow:auto;background:#fff;}

/* タスクバー */
.taskbar{
  position:fixed;bottom:0;width:100%;height:40px;
  background:#c0c0c0;display:flex;align-items:center;
}
.task-btn{margin:5px;padding:5px;border:2px solid #fff;cursor:pointer;}
.clock{margin-left:auto;padding:5px;}

/* テロップ */
.ticker{
  position:fixed;
  bottom:40px;
  width:100%;
  background:black;
  color:lime;
  overflow:hidden;
}
.ticker-text{
  white-space:nowrap;
  padding-left:100%;
  animation:scroll 15s linear infinite;
}
@keyframes scroll{100%{transform:translateX(-100%);}}

/* LIVE点滅 */
.live-on{color:red;animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0;}}

/* 小窓 */
.mini{
  position:fixed!important;
  bottom:50px;
  right:10px;
  width:260px!important;
  height:180px!important;
  z-index:9999;
}
</style>
</head>

<body>

<div id="boot" style="position:fixed;inset:0;background:black;color:lime;display:flex;align-items:center;justify-content:center;">
MepoOS Loading...
</div>

<div class="desktop-screen" id="desktop">

<div class="desktop">
<div class="icon" ondblclick="openWin(bbsWin)">掲示板</div>
<div class="icon" ondblclick="openWin(ytWin)">配信</div>
</div>

<!-- YouTube -->
<div class="window" id="ytWin" style="top:100px;left:400px;">
<div class="titlebar">
<span id="ytTitle">配信</span>
<div>
<button onclick="toggleMini()">小</button>
<button onclick="closeWin(ytWin)">×</button>
</div>
</div>

<div class="content">

<h3 id="liveLabel">LIVE</h3>

<div id="playerWrap">
<div id="player"></div>
<div>
<button onclick="stopVideo()">停止</button>
<button onclick="muteVideo()">ミュート</button>
</div>
</div>

<div id="live"></div>

<h3>予定</h3>
<div id="upcoming"></div>

<h3>アーカイブ</h3>
<div id="archive"></div>

</div>
</div>

<!-- BBS（修正済み） -->
<div class="window" id="bbsWin" style="top:80px;left:120px;">
<div class="titlebar">
<span>掲示板</span>
<div>
<button onclick="closeWin(bbsWin)">×</button>
</div>
</div>
<div class="content">
掲示板（ここは元のままでもOK）
</div>
</div>

<!-- テロップ -->
<div class="ticker">
<div class="ticker-text">
★☆★ NEW!! ★☆★ めぽるーむへようこそ！！！ ★☆★
</div>
</div>

<!-- タスクバー -->
<div class="taskbar">
<div class="task-btn" onclick="openWin(ytWin)">配信</div>
<div class="clock" id="clock"></div>
</div>

</div>

<script>
setTimeout(()=>{boot.style.display="none";desktop.style.display="block";},1500);

let topZ=1;
function openWin(el){el.style.display="block";el.style.zIndex=++topZ;}
function closeWin(el){el.style.display="none";}

/* 時計 */
setInterval(()=>clock.innerHTML=new Date().toLocaleTimeString(),1000);

/* ===== YouTube ===== */

const API_KEY="ここにAPIキー";
const CHANNEL_ID="UCmUlzug_w0WqRdTsEMJHjFw";

let currentVideo=null;
let isMini=false;
let isMuted=false;
let notified=false;

async function loadYT(type,target){
 try{
  const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=${type}&type=video&key=${API_KEY}`);
  const data=await res.json();

  let html="";

  if(data.items && data.items.length){

    if(type==="live"){
      liveLabel.innerHTML="🔴 LIVE中！";
      liveLabel.classList.add("live-on");
      ytTitle.innerText="🔴 配信中";

      if(!notified){
        notifyLive();
        notified=true;
      }

      playVideo(data.items[0].id.videoId);
    }

    data.items.forEach(v=>{
      html+=`
      <div onclick="playVideo('${v.id.videoId}')" style="cursor:pointer">
      <img src="${v.snippet.thumbnails.medium.url}" width="200"><br>
      ${v.snippet.title}
      </div><hr>`;
    });
  }

  document.getElementById(target).innerHTML=html||"なし";

 }catch{
  document.getElementById(target).innerHTML="失敗";
 }
}

function playVideo(id){
 currentVideo=id;
 player.innerHTML=`
 <iframe id="ytframe" width="100%" height="200"
 src="https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1"
 frameborder="0"></iframe>`;
}

function toggleMini(){
 if(!currentVideo)return;
 ytWin.classList.toggle("mini");
 isMini=!isMini;
}

function stopVideo(){
 player.innerHTML="";
 currentVideo=null;
}

function muteVideo(){
 let iframe=document.getElementById("ytframe");
 if(!iframe)return;

 iframe.contentWindow.postMessage(JSON.stringify({
  event:"command",
  func:isMuted?"unMute":"mute"
 }),"*");

 isMuted=!isMuted;
}

function notifyLive(){
 const n=document.createElement("div");
 n.innerText="🔴 配信開始！";
 n.style.position="fixed";
 n.style.bottom="50px";
 n.style.right="10px";
 n.style.background="#000";
 n.style.color="lime";
 n.style.padding="10px";
 n.style.zIndex="9999";

 document.body.appendChild(n);
 setTimeout(()=>n.remove(),4000);
}

loadYT("live","live");
loadYT("upcoming","upcoming");
loadYT("completed","archive");
</script>

</body>
</html>
