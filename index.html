<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋⊂( ᴖ ̫ ᴖ )⊃</title>

<style>
:root{
 --main:#7fe3ff;
 --accent:#ffb3da;
 --bg:#eaffff;
}

body{
 margin:0;
 font-family:"MS Gothic";
 background:linear-gradient(var(--bg),#bdefff);
 overflow:hidden;
}

/* レトロ感 */
.window{
 position:absolute;
 width:320px;
 background:#eaf6ff;
 border:2px solid #8ecfff;
 border-radius:6px;
 box-shadow:2px 2px 0 #6aaed6;
}

.titlebar{
 background:linear-gradient(#bdefff,#7fe3ff);
 padding:5px;
 cursor:move;
 font-weight:bold;
}

/* レイアウト */
.container{display:flex;height:100vh;}
.side{
 width:20%;
 padding:10px;
 background:rgba(255,255,255,0.3);
 backdrop-filter:blur(10px);
}
.main{width:60%;position:relative;}

.content{
 padding:10px;
 max-height:500px;
 overflow:auto;
}

/* 星 */
.star{
 position:fixed;
 width:6px;height:6px;
 background:white;
 border-radius:50%;
 animation:fall linear infinite;
}
@keyframes fall{
 from{transform:translateY(-10vh);}
 to{transform:translateY(110vh);}
}

/* LIVE */
.live{
 color:red;
 font-weight:bold;
 animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0;}}

/* グッズ */
.pill{
 width:60px;height:30px;
 border-radius:20px;
 background:linear-gradient(#fff,#cdefff);
 display:inline-block;
 cursor:pointer;
 text-align:center;
 line-height:30px;
 margin:5px;
}

/* 🐰 */
.rabbit{
 position:fixed;
 font-size:30px;
 pointer-events:none;
 animation:rabbit 1s forwards;
}
@keyframes rabbit{
 0%{opacity:0;transform:scale(.5)}
 30%{opacity:1;transform:scale(1.2)}
 100%{opacity:0;transform:translateY(-40px)}
}

/* 裏世界 */
#ura{
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 background:black;
 display:none;
 z-index:9999;
}
#uraTime{
 position:absolute;
 bottom:10px;
 right:10px;
 color:red;
}
.flash{
 position:absolute;
 top:50%;left:50%;
 transform:translate(-50%,-50%);
 color:red;
 font-size:40px;
 display:none;
}
</style>
</head>

<body>

<!-- 星 -->
<script>
for(let i=0;i<50;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.animationDuration=(2+Math.random()*3)+"s";
 document.body.appendChild(s);
}
</script>

<div class="container">

<!-- 左（そのまま維持） -->
<div class="side">
<p>🦷めぽ情報🌧</p>
<p> 堕メ天使の妄堕めぽ（Mouda Mepo）🍰11/03</p>
<p> 天界から追放された堕天使VTuber </p>
<p> ダメダメなめぽと見張り役の兎田さん（肩のぬいぐるみ）が、インターネットに触れて世界を知る物語</p>

<hr>

<p><a href="https://x.com/sakimr1020" target="_blank">❥お仕立て→さきまる様</a></p>
<p><a href="https://x.com/kaikaipnsk" target="_blank">❥OP・ED ぽんすけかいかい 様</a></p>
<p><a href="https://www.youtube.com/@妄堕めぽ-MoudaMepo" target="_blank">❥モデリング→妄堕めぽ</a></p>

<p id="counter"></p>
</div>

<!-- メイン -->
<div class="main">

<!-- 配信 -->
<div class="window" id="liveWin" style="top:40px;left:40px;">
<div class="titlebar">配信情報</div>
<div class="content">
<div id="live"></div>
<div id="archive"></div>
</div>
</div>

<!-- Twitter表示（埋め込み） -->
<div class="window" style="top:40px;left:400px;">
<div class="titlebar">最新ツイート</div>
<div class="content">
<a class="twitter-timeline" data-height="300"
 href="https://twitter.com/hello_mepo">Tweets</a>
</div>
</div>

<!-- グッズ -->
<div class="window" id="goodsWin" style="top:250px;left:200px;">
<div class="titlebar">グッズ</div>
<div class="content">
<div class="pill" onclick="buy(event)">アクスタ</div>
<div class="pill" onclick="buy(event)">アクキー</div>
</div>
</div>

</div>

<!-- 右（そのまま） -->
<div class="side">
<h2>🦷リンク🦷</h2>
<p><a href="https://x.com/hello_mepo" target="_blank">Twitter</a></p>
</div>

</div>

<!-- 裏世界 -->
<div id="ura">
<div id="uraTime"></div>
<div class="flash" id="flash">堕ちろ</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

/* Firebase */
const firebaseConfig={
 apiKey:"YOUR_KEY",
 databaseURL:"YOUR_DB"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* カウンター */
const counterRef=db.ref("counter");
counterRef.transaction(c=>(c||0)+1);
counterRef.on("value",s=>{
 counter.innerHTML=`訪問者 ${s.val()||0}`;
});

/* 🐰 */
function rabbit(x,y){
 let r=document.createElement("div");
 r.className="rabbit";
 r.innerHTML=["🐰","🩵","🦷"][Math.floor(Math.random()*3)];
 r.style.left=x+"px";
 r.style.top=y+"px";
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),1000);
}
document.addEventListener("click",e=>{
 rabbit(e.clientX,e.clientY);
});

/* YouTube API */
const API_KEY="YOUR_YOUTUBE_KEY";
const CHANNEL_ID="UCmUlzug_w0WqRdTsEMJHjFw";

async function loadYT(){
 let res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&order=date&type=video&key=${API_KEY}`);
 let data=await res.json();

 let html="";
 data.items.slice(0,5).forEach(v=>{
  html+=`<div>
  <img src="${v.snippet.thumbnails.medium.url}" width="200"><br>
  ${v.snippet.title}
  </div><hr>`;
 });
 archive.innerHTML=html;
}
loadYT();

/* ドラッグ */
function drag(el){
 let p1=0,p2=0,p3=0,p4=0;
 el.querySelector(".titlebar").onmousedown=e=>{
  p3=e.clientX;p4=e.clientY;
  document.onmousemove=e=>{
   p1=p3-e.clientX;p2=p4-e.clientY;
   p3=e.clientX;p4=e.clientY;
   el.style.top=(el.offsetTop-p2)+"px";
   el.style.left=(el.offsetLeft-p1)+"px";
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}
drag(liveWin);
drag(goodsWin);

/* 裏世界（2秒長押し） */
let timer;
document.addEventListener("mousedown",()=>{
 timer=setTimeout(()=>enterUra(),2000);
});
document.addEventListener("mouseup",()=>clearTimeout(timer));

function enterUra(){
 ura.style.display="block";
 document.querySelector(".container").style.display="none";

 setInterval(()=>{
  uraTime.innerText=new Date().toLocaleTimeString();
 },1000);

 setInterval(()=>{
  if(Math.random()<0.3){
   flash.style.display="block";
   setTimeout(()=>flash.style.display="none",100);
  }
 },2000);
}

/* ノイズ */
ura.addEventListener("click",()=>{
 const ctx=new AudioContext();
 const o=ctx.createOscillator();
 const g=ctx.createGain();
 o.connect(g);g.connect(ctx.destination);
 g.gain.value=0.02;
 o.start();
 setTimeout(()=>o.stop(),50);
});
</script>

<!-- Twitter script -->
<script async src="https://platform.twitter.com/widgets.js"></script>

</body>
</html>
