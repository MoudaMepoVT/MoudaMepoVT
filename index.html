
<!DOCTYPE html>

<title>妄堕めぽのお部屋</title>

<style>
body{
  margin:0;
  font-family:"MS Gothic";
  background:linear-gradient(#dffbff,#bdefff);
  overflow:hidden;
}

/* レイアウト */
.container{display:flex;height:100vh;}
.side{
  width:20%;
  padding:10px;
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(10px);
}
.main{width:60%;position:relative;}

/* ウィンドウ */
.window{
  position:absolute;
  width:320px;
  background:rgba(255,255,255,0.35);
  border:2px solid #aeefff;
  border-radius:12px;
  box-shadow:0 0 15px #7fe3ff;
  backdrop-filter:blur(12px);
}
.titlebar{
  background:linear-gradient(90deg,#7fe3ff,#c8f7ff);
  padding:5px;
  cursor:move;
}
.content{
  padding:10px;
  max-height:320px;
  overflow:auto;
}

/* キラキラ */
.star{
  position:fixed;
  width:5px;height:5px;
  background:white;
  border-radius:50%;
  animation:fall linear infinite;
}
@keyframes fall{
  from{transform:translateY(-10vh);}
  to{transform:translateY(110vh);}
}

/* 立ち絵 */
.character{
  position:fixed;
  right:20px;
  bottom:0;
  width:200px;
  animation:float 3s infinite;
}
@keyframes float{
  50%{transform:translateY(-15px);}
}

/* LIVE点滅 */
.live{
  color:red;
  font-weight:bold;
  animation:blink 1s infinite;
}
@keyframes blink{
  50%{opacity:0;}
}

/* 💊 */
.pill-sheet{
  display:grid;
  grid-template-columns:repeat(3,60px);
  gap:10px;
  justify-content:center;
}
.pill{
  width:60px;height:30px;
  border-radius:20px;
  background:linear-gradient(#fff,#cdefff);
  position:relative;
  cursor:pointer;
}
.pill::before{
  content:"";
  position:absolute;
  width:50%;
  height:100%;
  background:#7fe3ff;
  border-radius:20px 0 0 20px;
}
.pill span{
  position:absolute;
  width:100%;
  text-align:center;
  font-size:10px;
  top:8px;
}

/* 🐰 */
.rabbit{
  position:fixed;
  font-size:30px;
  pointer-events:none;
  animation:rabbit 1s forwards;
}
@keyframes rabbit{
  0%{opacity:0;transform:scale(.5)}
  30%{opacity:1;transform:scale(1.2)}
  100%{opacity:0;transform:translateY(-40px)}
}

/* BBS */
.bbs-post{
  border-bottom:1px dashed #7fe3ff;
  padding:5px;
  font-size:12px;
}
</style>
</head>

/* 🪟 */
function drag(el){
 let p1=0,p2=0,p3=0,p4=0;
 el.querySelector(".titlebar").onmousedown=e=>{
  p3=e.clientX;p4=e.clientY;
  document.onmousemove=e=>{
   p1=p3-e.clientX;p2=p4-e.clientY;
   p3=e.clientX;p4=e.clientY;
   el.style.top=(el.offsetTop-p2)+"px";
   el.style.left=(el.offsetLeft-p1)+"px";
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}
