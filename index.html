<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:"MS UI Gothic";font-size:18px;}

.desktop-screen{
  display:none;
  height:100vh;
  background: linear-gradient(to bottom,#87cefa,#b0e0ff,#e0ffff);
}

/* アイコン */
.desktop{position:absolute;top:20px;left:20px;}
.icon{width:100px;text-align:center;color:white;margin-bottom:20px;cursor:pointer;}

/* ウィンドウ */
.window{
  position:absolute;
  width:500px;
  height:400px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  display:none;
}

.titlebar{
  background:linear-gradient(to right,#000080,#1084d0);
  color:white;
  padding:5px;
  display:flex;
  justify-content:space-between;
  cursor:move;
}

.content{
  background:white;
  height:calc(100% - 30px);
  overflow:auto;
  padding:10px;
}

/* お知らせ */
.notice{
  position:fixed;
  right:20px;
  bottom:90px;
  width:260px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  z-index:9999;
}

.notice .content{padding:8px;}

/* カード */
.notice-card{
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  background:white;
  padding:5px;
  font-size:14px;
}

.notice-card img{width:100%;}

.notice-live{
  color:red;
  font-weight:bold;
}

/* 🔴 点滅 */
.blink{
  animation:blinkAnim 1s infinite;
}
@keyframes blinkAnim{
  0%{opacity:1;}
  50%{opacity:0;}
  100%{opacity:1;}
}

/* タスクバー */
.taskbar{
  position:fixed;bottom:0;width:100%;height:50px;
  background:#c0c0c0;display:flex;align-items:center;
}

.task-btn,.link-btn{
  margin-left:5px;
  padding:5px;
  border:2px solid #fff;
  cursor:pointer;
}

.live-indicator{
  margin-left:10px;
  color:red;
  font-weight:bold;
}

.clock{
  margin-left:auto;
  padding:5px;
  font-size:14px;
}
</style>
</head>

<body>

<div id="boot" style="position:fixed;inset:0;background:black;color:lime;display:flex;align-items:center;justify-content:center;">
MepoOS Loading...
</div>

<div id="desktop" class="desktop-screen">

<div class="desktop">
<div class="icon" ondblclick="openWin(ytWin)">📺<br>配信</div>
</div>

<!-- 配信 -->
<div class="window" id="ytWin" style="top:120px;left:200px;">
<div class="titlebar">配信</div>
<div class="content">
<h3 id="liveLabel">確認中...</h3>
<div id="player"></div>

<h3>🔴 LIVE</h3>
<div id="live"></div>

<h3>⏰ 予定</h3>
<div id="upcoming"></div>
</div>
</div>

<!-- お知らせ -->
<div class="notice">
<div class="titlebar">📢 お知らせ</div>
<div class="content" id="noticeContent">読み込み中...</div>
</div>

<!-- タスクバー -->
<div class="taskbar">
<div class="task-btn" onclick="openWin(ytWin)">配信</div>

<!-- ★ここが追加 -->
<div id="taskLive" class="live-indicator"></div>

<div class="clock" id="clock"></div>
</div>

</div>

<script>
/* 起動 */
setTimeout(()=>{
 boot.style.display="none";
 desktop.style.display="block";
},1500);

/* 時計 */
setInterval(()=>{
 clock.innerHTML=new Date().toLocaleTimeString();
},1000);

/* ウィンドウ */
let topZ=1;
function openWin(win){
 win.style.display="block";
 win.style.zIndex=++topZ;
}

/* =====================
   YouTube
===================== */
const API_KEY="AIzaSyCWEQ1J0mEq8EFo7Cw5UYHpGRhYbC0Tu88";
const CHANNEL_ID="UCmUlzug_w0WqRdTsEMJHjFw";

let prevLiveId=null;

/* お知らせ */
function updateNoticeUI(data){
 const box=document.getElementById("noticeContent");

 if(!data || data.length===0){
  box.innerHTML="<div class='notice-card'>配信なし</div>";
  return;
 }

 const item=data[0];
 const id=item.id.videoId;

 box.innerHTML=`
 <div class="notice-card">
   <div class="notice-live blink">🔴 LIVE中</div>
   <img src="${item.snippet.thumbnails.medium.url}">
   <div>${item.snippet.title}</div>
   <a href="https://youtube.com/watch?v=${id}" target="_blank">▶見る</a>
 </div>`;
}

/* 一覧 */
async function loadYT(type,target){
 const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=${type}&type=video&key=${API_KEY}`);
 const data=await res.json();

 let html="";
 if(data.items){
  data.items.forEach(i=>{
   html+=`
   <div>
    <img src="${i.snippet.thumbnails.medium.url}" width="200"><br>
    ${i.snippet.title}<br>
   </div><hr>`;
  });
 }

 document.getElementById(target).innerHTML=html;

 if(type==="live"){
  updateNoticeUI(data.items);
 }
}

/* LIVE監視 */
async function checkLive(){
 const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`);
 const d=await r.json();

 const task=document.getElementById("taskLive");

 if(d.items && d.items.length){
  const id=d.items[0].id.videoId;

  document.getElementById("liveLabel").innerHTML="<span class='blink'>🔴 LIVE中</span>";

  document.getElementById("player").innerHTML=
  `<iframe width="100%" height="260"
  src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1"></iframe>`;

  task.innerHTML="<span class='blink'>🔴 LIVE</span>";

  if(prevLiveId!==id){
   prevLiveId=id;
   updateNoticeUI(d.items);
  }

 }else{
  document.getElementById("liveLabel").innerText="配信なし";
  task.innerHTML="";
  prevLiveId=null;
  updateNoticeUI([]);
 }
}

/* 初期 */
loadYT("live","live");
loadYT("upcoming","upcoming");

setInterval(checkLive,30000);
checkLive();
</script>

</body>
</html>
