<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:monospace;}

.desktop-screen{
  display:none;
  height:100vh;
  background: linear-gradient(#87cefa,#e0ffff);
}

/* アイコン */
.icon{
  width:80px;
  text-align:center;
  color:white;
  position:absolute;
  cursor:move;
  user-select:none;
}

/* ウィンドウ */
.window{
  position:absolute;
  width:300px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  display:none;
}

.titlebar{
  background:#000080;
  color:white;
  padding:4px;
  cursor:move;
}

/* タスクバー */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:40px;
  background:#c0c0c0;
  display:flex;
  align-items:center;
}

.task-btn{margin:5px;padding:5px;border:2px solid #fff;cursor:pointer;}

/* 右クリックメニュー */
#contextMenu{
  position:absolute;
  background:#c0c0c0;
  border:2px solid #fff;
  display:none;
  z-index:9999;
}
#contextMenu div{
  padding:5px 10px;
  cursor:pointer;
}
#contextMenu div:hover{
  background:#000080;
  color:white;
}
</style>
</head>

<body>

<div id="boot" style="position:fixed;inset:0;background:black;color:lime;display:flex;align-items:center;justify-content:center;">
MepoOS 起動中...
</div>

<div class="desktop-screen" id="desktop">

<!-- アイコン -->
<div class="icon" id="icon-bbs" ondblclick="openWin(bbsWin)">掲示板</div>
<div class="icon" id="icon-yt" ondblclick="openWin(ytWin)">配信</div>
<div class="icon" id="icon-link" ondblclick="openWin(linkWin)">リンク</div>

<!-- ウィンドウ -->
<div class="window" id="bbsWin" style="top:80px;left:120px;">
<div class="titlebar">掲示板 <button onclick="closeWin(bbsWin)">×</button></div>
<div style="padding:10px;">BBS</div>
</div>

<div class="window" id="ytWin" style="top:100px;left:350px;">
<div class="titlebar">配信 <button onclick="closeWin(ytWin)">×</button></div>
<div style="padding:10px;">YouTube</div>
</div>

<div class="window" id="linkWin" style="top:120px;left:200px;">
<div class="titlebar">リンク <button onclick="closeWin(linkWin)">×</button></div>
<div style="padding:10px;">
<a href="https://youtube.com" target="_blank">YouTube</a>
</div>
</div>

<!-- タスクバー -->
<div class="taskbar">
<div class="task-btn" onclick="openWin(bbsWin)">掲示板</div>
<div class="task-btn" onclick="openWin(ytWin)">配信</div>
<div class="task-btn" onclick="openWin(linkWin)">リンク</div>
</div>

<!-- 右クリックメニュー -->
<div id="contextMenu">
  <div onclick="sortIcons()">📂 並べ替え</div>
  <div onclick="deleteIcon()">🗑 削除</div>
</div>

</div>

<script>
/* 起動 */
setTimeout(()=>{
 boot.style.display="none";
 desktop.style.display="block";
 initIcons();
},1200);

/* ウィンドウ */
let topZ=1;
function openWin(el){el.style.display="block";el.style.zIndex=++topZ;}
function closeWin(el){el.style.display="none";}

/* ===== アイコン初期化 ===== */
function initIcons(){
 document.querySelectorAll(".icon").forEach((icon,i)=>{
   let saved = JSON.parse(localStorage.getItem(icon.id));

   if(saved){
     icon.style.left=saved.x+"px";
     icon.style.top=saved.y+"px";
   }else{
     icon.style.left="10px";
     icon.style.top=(10+i*90)+"px";
   }

   dragIcon(icon);
   setupContext(icon);
 });
}

/* ===== ドラッグ ===== */
function dragIcon(el){
 let offsetX,offsetY;

 el.onmousedown=e=>{
   offsetX=e.clientX-el.offsetLeft;
   offsetY=e.clientY-el.offsetTop;

   document.onmousemove=e=>{
     el.style.left=(e.clientX-offsetX)+"px";
     el.style.top=(e.clientY-offsetY)+"px";
   };
 };

 document.onmouseup=()=>{
   document.onmousemove=null;

   localStorage.setItem(el.id,JSON.stringify({
     x:el.offsetLeft,
     y:el.offsetTop
   }));
 };

 el.ondragstart=()=>false;
}

/* ===== 右クリック ===== */
let currentIcon=null;

function setupContext(icon){
 icon.addEventListener("contextmenu",e=>{
   e.preventDefault();

   currentIcon=icon;

   contextMenu.style.left=e.clientX+"px";
   contextMenu.style.top=e.clientY+"px";
   contextMenu.style.display="block";
 });
}

/* メニュー閉じる */
document.addEventListener("click",()=>{
 contextMenu.style.display="none";
});

/* 削除 */
function deleteIcon(){
 if(!currentIcon) return;

 localStorage.removeItem(currentIcon.id);
 currentIcon.remove();

 contextMenu.style.display="none";
}

/* 並べ替え */
function sortIcons(){
 let icons=document.querySelectorAll(".icon");

 let x=10,y=10;

 icons.forEach(icon=>{
   icon.style.left=x+"px";
   icon.style.top=y+"px";

   localStorage.setItem(icon.id,JSON.stringify({x,y}));

   y+=90;
   if(y>window.innerHeight-100){
     y=10;
     x+=100;
   }
 });

 contextMenu.style.display="none";
}
</script>

</body>
</html>
