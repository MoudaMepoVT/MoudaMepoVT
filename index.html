<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:"MS UI Gothic","MS Gothic",monospace;
  font-size:14px;
}

/* 背景 */
#bgLayer{
  position:fixed;
  inset:0;
  background:
    url("https://via.placeholder.com/500x700") no-repeat right bottom,
    #008080;
  background-size:contain;
  z-index:0;
  pointer-events:none;
}

/* 👻 黒い影 */
#shadow{
  position:fixed;
  width:80px;
  height:80px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,0,0,0.6) 0%, transparent 70%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:9997;
  display:none;
}

/* 🌙 ホラー状態 */
.horror{
  filter:brightness(0.7) contrast(1.3);
}

/* ノイズ */
.noise{
  position:fixed;
  inset:0;
  background:url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
  opacity:0.15;
  pointer-events:none;
  z-index:9996;
}

/* ウィンドウ */
.window{
  position:absolute;
  width:500px;
  height:400px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  display:none;
  box-shadow:2px 2px 0 #000;
}

/* タイトルバー */
.titlebar{
  background:linear-gradient(to right,#000080,#1084d0);
  color:white;
  padding:4px;
  display:flex;
  justify-content:space-between;
  cursor:move;
}

.win-btns button{
  width:22px;height:22px;
  margin-left:2px;
}

.content{
  background:white;
  height:calc(100% - 30px);
  overflow:auto;
  padding:10px;
}

/* お知らせ */
.notice{
  position:fixed;
  right:20px;
  bottom:90px;
  width:280px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  z-index:9999;
}

.notice-card{
  background:white;
  padding:6px;
}

/* 点滅 */
.blink{animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0;}}

/* タスクバー */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:50px;
  background:#c0c0c0;
  display:flex;
  align-items:center;
}

.task-btn{margin-left:5px;padding:5px;}

.live-indicator{
  margin-left:10px;
  color:red;
  font-weight:bold;
}

.clock{margin-left:auto;padding:5px;}
</style>
</head>

<body>

<div id="bgLayer"></div>
<div id="shadow"></div>
<div id="noiseLayer"></div>

<div id="desktop">

<div class="window" id="ytWin" style="top:120px;left:200px;">
<div class="titlebar">配信</div>
<div class="content">
<h3 id="liveLabel">確認中...</h3>
<div id="player"></div>
</div>
</div>

<div class="notice">
<div class="titlebar">📢 お知らせ</div>
<div id="noticeContent"></div>
</div>

<div class="taskbar">
<div class="task-btn" onclick="openWin(ytWin)">配信</div>
<div id="taskLive" class="live-indicator"></div>
<div class="clock" id="clock"></div>
</div>

</div>

<script>
/* 時計 */
setInterval(()=>{
 clock.innerHTML=new Date().toLocaleTimeString();
},1000);

/* ウィンドウ */
let topZ=1;
function openWin(win){
 win.style.display="block";
 win.style.zIndex=++topZ;
}

/* ================= YouTube ================= */
const API_KEY="YOUR_KEY";
const CHANNEL_ID="UCmUlzug_w0WqRdTsEMJHjFw";

let isLive=false;

/* お知らせ */
function updateNoticeUI(data){
 const box=document.getElementById("noticeContent");

 if(!data || data.length===0){
  box.innerHTML="<div class='notice-card'>配信なし</div>";
  return;
 }

 const item=data[0];
 const id=item.id.videoId;

 box.innerHTML=`
 <div class="notice-card">
   <div class="blink">🔴 LIVE中</div>
   <img src="${item.snippet.thumbnails.medium.url}">
   <div>${item.snippet.title}</div>
 </div>`;
}

/* LIVEチェック */
async function checkLive(){
 const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`);
 const d=await r.json();

 const task=document.getElementById("taskLive");

 if(d.items && d.items.length){
  isLive=true;
  document.body.classList.remove("horror");
  document.getElementById("shadow").style.display="none";
  document.getElementById("noiseLayer").classList.remove("noise");

  task.innerHTML="<span class='blink'>🔴 LIVE</span>";
  updateNoticeUI(d.items);

 }else{
  isLive=false;
  document.body.classList.add("horror");
  document.getElementById("shadow").style.display="block";
  document.getElementById("noiseLayer").classList.add("noise");

  task.innerHTML="";
  updateNoticeUI([]);
 }
}

setInterval(checkLive,10000);
checkLive();

/* ================= ホラー演出 ================= */

/* 👤 マウス影 */
document.addEventListener("mousemove",e=>{
 if(!isLive){
   const s=document.getElementById("shadow");
   s.style.left=e.clientX+"px";
   s.style.top=e.clientY+"px";
 }
});

/* 📺 ウィンドウずれ */
setInterval(()=>{
 if(!isLive){
   document.querySelectorAll(".window").forEach(w=>{
     const x=Math.random()<0.5?1:-1;
     const y=Math.random()<0.5?1:-1;
     w.style.left=(w.offsetLeft+x)+"px";
     w.style.top=(w.offsetTop+y)+"px";
   });
 }
},300);

/* 🖱 クリックで一時解除 */
document.addEventListener("click",()=>{
 if(!isLive){
   document.body.classList.remove("horror");
   document.getElementById("shadow").style.display="none";
   document.getElementById("noiseLayer").classList.remove("noise");

   setTimeout(()=>{
     if(!isLive){
       document.body.classList.add("horror");
       document.getElementById("shadow").style.display="block";
       document.getElementById("noiseLayer").classList.add("noise");
     }
   },2000);
 }
});
</script>

</body>
</html>
