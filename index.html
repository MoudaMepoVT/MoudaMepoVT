<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:"MS UI Gothic";font-size:18px;}

.desktop-screen{
  display:none;
  height:100vh;
  background: linear-gradient(to bottom,#87cefa,#b0e0ff,#e0ffff);
}

/* アイコン */
.desktop{position:absolute;top:20px;left:20px;}
.icon{width:100px;text-align:center;color:white;margin-bottom:20px;cursor:pointer;}

/* ウィンドウ */
.window{
  position:absolute;
  width:500px;
  height:400px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  display:none;
}

.titlebar{
  background:linear-gradient(to right,#000080,#1084d0);
  color:white;
  padding:5px;
  display:flex;
  justify-content:space-between;
  cursor:move;
}

.content{
  background:white;
  height:calc(100% - 30px);
  overflow:auto;
  padding:10px;
}

/* お知らせ */
.notice{
  position:fixed;
  right:20px;
  bottom:90px;
  width:260px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  z-index:9999;
}

.notice .content{padding:8px;}

.notice-card{
  background:white;
  border:2px solid #000;
  padding:6px;
  font-size:12px;
}

.notice-card img{width:100%;}

.notice-live{
  color:red;
  font-weight:bold;
}

/* 配信カード */
.yt-card{
  border:1px solid #999;
  margin-bottom:10px;
  padding:5px;
}

.yt-card img{width:100%;}

/* タスクバー */
.taskbar{
  position:fixed;bottom:0;width:100%;height:50px;
  background:#c0c0c0;display:flex;align-items:center;
}

.task-btn{
  margin-left:5px;
  padding:5px;
  border:2px solid #fff;
  cursor:pointer;
}

.clock{
  margin-left:auto;
  padding:5px;
  font-size:14px;
}

/* ===== トースト通知 ===== */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  width:260px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  transform:translateY(120%);
  opacity:0;
  z-index:10000;
}

.toast-inner{
  background:white;
  padding:8px;
  font-size:12px;
}

.toast img{width:100%;}

.toast.show{animation:toastIn 0.4s forwards;}
.toast.hide{animation:toastOut 0.4s forwards;}

@keyframes toastIn{
  0%{transform:translateY(120%);opacity:0;}
  60%{transform:translateY(-10px);opacity:1;}
  100%{transform:translateY(0);opacity:1;}
}

@keyframes toastOut{
  to{transform:translateY(120%);opacity:0;}
}

/* 点滅 */
.blink{
  animation:blinkAnim 1s infinite;
}

@keyframes blinkAnim{
  0%,100%{opacity:1;}
  50%{opacity:0.2;}
}

.task-live{
  color:red;
  font-weight:bold;
  margin-left:10px;
}
</style>
</head>

<body>

<div id="boot" style="position:fixed;inset:0;background:black;color:lime;display:flex;align-items:center;justify-content:center;">
MepoOS Loading...
</div>

<div id="desktop" class="desktop-screen">

<div class="desktop">
<div class="icon" ondblclick="openWin(ytWin)">📺<br>配信</div>
</div>

<!-- 配信 -->
<div class="window" id="ytWin" style="top:120px;left:200px;">
<div class="titlebar">配信</div>
<div class="content">
<h3 id="liveLabel">確認中...</h3>
<div id="player"></div>

<h3>🔴 LIVE</h3>
<div id="live"></div>

<h3>⏰ 予定</h3>
<div id="upcoming"></div>
</div>
</div>

<!-- お知らせ -->
<div class="notice">
<div class="titlebar">📢 お知らせ</div>
<div class="content" id="noticeContent">読み込み中...</div>
</div>

<!-- タスクバー -->
<div class="taskbar">
<div class="task-btn" onclick="openWin(ytWin)">配信</div>
<div id="taskLive" class="task-live"></div>
<div class="clock" id="clock"></div>
</div>

</div>

<!-- トースト -->
<div id="toast" class="toast">
  <div class="toast-inner" id="toastContent"></div>
</div>

<script>
/* 起動 */
setTimeout(()=>{
 boot.style.display="none";
 desktop.style.display="block";
},1500);

/* 時計 */
setInterval(()=>{
 clock.innerHTML=new Date().toLocaleTimeString();
},1000);

/* ウィンドウ */
let topZ=1;
function openWin(win){
 win.style.display="block";
 win.style.zIndex=++topZ;
}

/* YouTube */
const API_KEY = "AIzaSyCWEQ1J0mEq8EFo7Cw5UYHpGRhYbC0Tu88";
const CHANNEL_ID = "UCmUlzug_w0WqRdTsEMJHjFw";

let prevLiveId=null;

/* カード */
function makeCard(item){
 return `
 <div class="yt-card">
   <img src="${item.snippet.thumbnails.medium.url}">
   <div>${item.snippet.title}</div>
   <a href="https://youtube.com/watch?v=${item.id.videoId}" target="_blank">▶見る</a>
 </div>`;
}

/* お知らせ */
function updateNoticeUI(data){
 const box=document.getElementById("noticeContent");

 if(!data || data.length===0){
   box.innerHTML="<div class='notice-card'>配信なし</div>";
   return;
 }

 const item=data[0];
 box.innerHTML=`
 <div class="notice-card">
   <div class="notice-live">🔴 LIVE中</div>
   <img src="${item.snippet.thumbnails.medium.url}">
   <div>${item.snippet.title}</div>
 </div>`;
}

/* トースト */
function showToast(item){
 const toast=document.getElementById("toast");
 const box=document.getElementById("toastContent");

 box.innerHTML=`
 <div style="color:red;font-weight:bold;">🔴 配信開始！</div>
 <img src="${item.snippet.thumbnails.medium.url}">
 <div>${item.snippet.title}</div>
 `;

 toast.classList.remove("hide");
 toast.classList.add("show");

 setTimeout(()=>{
   toast.classList.remove("show");
   toast.classList.add("hide");
 },5000);
}

/* 一覧 */
async function loadYT(type,target){
 const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=${type}&type=video&key=${API_KEY}`);
 const data=await res.json();

 let html="";
 if(data.items){
   data.items.forEach(i=>html+=makeCard(i));
 }

 document.getElementById(target).innerHTML=html;

 if(type==="live"){
   updateNoticeUI(data.items);
 }
}

/* LIVE監視 */
async function checkLive(){
 const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`);
 const d=await r.json();

 if(d.items && d.items.length){
   const item=d.items[0];
   const id=item.id.videoId;

   liveLabel.innerText="🔴 LIVE中";
   liveLabel.classList.add("blink");

   document.getElementById("taskLive").innerText="🔴 LIVE";
   document.getElementById("taskLive").classList.add("blink");

   player.innerHTML=`
   <iframe width="100%" height="260"
   src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1"></iframe>`;

   if(prevLiveId!==id){
     prevLiveId=id;
     showToast(item);
     updateNoticeUI(d.items);
   }

 }else{
   liveLabel.innerText="配信なし";
   liveLabel.classList.remove("blink");

   document.getElementById("taskLive").innerText="";
   document.getElementById("taskLive").classList.remove("blink");

   prevLiveId=null;
   updateNoticeUI([]);
 }
}

/* 初期 */
loadYT("live","live");
loadYT("upcoming","upcoming");

setInterval(checkLive,30000);
checkLive();
</script>

</body>
</html>
