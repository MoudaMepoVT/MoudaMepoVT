/* キラキラ背景 */
.star {
  position: fixed;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;

<!-- 🔴 配信エリア -->
<h2>★配信情報★</h2>

<h3>🔴 LIVE中</h3>
<div id="live"></div>

<h3>⏰ 配信予定</h3>
<div id="upcoming"></div>

<h3>📼 アーカイブ</h3>
<div id="archive"></div>

<script>
const API_KEY = "ここにAPIキー";
const CHANNEL_ID = "ここにチャンネルID";

async function loadYT(type, target) {
  const res = await fetch(
    `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=${type}&type=video&key=${API_KEY}`
  );
  const data = await res.json();

  let html = "";

  if (data.items.length === 0) {
    html = "<p>なし</p>";
  } else {
    data.items.forEach(item => {
      const title = item.snippet.title;
      const thumb = item.snippet.thumbnails.medium.url;
      const videoId = item.id.videoId;

      html += `
        <div>
          ${type === "live" ? '<p class="live">🔴 LIVE中！！！</p>' : ""}
          <img src="${thumb}" width="200"><br>
          ${title}<br>
          <a href="https://youtube.com/watch?v=${videoId}" target="_blank">
          ▶ 見に行く！
          </a>
        </div><hr>
      `;
    });
  }

  document.getElementById(target).innerHTML = html;
}

loadYT("live", "live");
loadYT("upcoming", "upcoming");
loadYT("completed", "archive");
</script>
