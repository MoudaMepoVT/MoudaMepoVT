<script>
/* ⏳ 長押しで裏 */
let pressTimer;

document.addEventListener("mousedown", () => {
  pressTimer = setTimeout(() => {
    window.location.href = "ura.html";
  }, 2000); // 2秒長押し
});

document.addEventListener("mouseup", () => {
  clearTimeout(pressTimer);
});

document.addEventListener("mouseleave", () => {
  clearTimeout(pressTimer);
});
</script>
