<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋⊂( ᴖ ̫ ᴖ )⊃</title>

<style>
:root{
 --main:#7fe3ff;
 --accent:#ffb3da;
 --bg:#eaffff;
}

body{
 margin:0;
 font-family:"MS Gothic";
 background:linear-gradient(var(--bg),#bdefff);
 overflow:hidden;
}

/* レイアウト */
.container{display:flex;height:100vh;}
.side{width:20%;padding:10px;background:rgba(255,255,255,0.3);}
.main{width:60%;position:relative;}

/* ウィンドウ */
.window{
 position:absolute;
 width:300px;
 background:rgba(255,255,255,0.4);
 border:2px solid var(--main);
 border-radius:12px;
 box-shadow:0 0 15px var(--main);
}
.titlebar{
 background:linear-gradient(90deg,var(--main),var(--accent));
 padding:5px;
 cursor:move;
}
.content{padding:10px;max-height:300px;overflow:auto;}

/* 星 */
.star{
 position:fixed;
 width:6px;height:6px;
 background:white;
 border-radius:50%;
 animation:fall linear infinite;
}
@keyframes fall{
 from{transform:translateY(-10vh);}
 to{transform:translateY(110vh);}
}

/* ガチャ */
.effect{
 position:fixed;
 pointer-events:none;
 animation:pop 1s forwards;
}
@keyframes pop{
 0%{opacity:0;transform:scale(.5)}
 30%{opacity:1;transform:scale(1.3)}
 100%{opacity:0;transform:translateY(-40px)}
}

/* 裏世界 */
#ura{
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 background:black;
 color:white;
 display:none;
 z-index:9999;
}
#uraTime{
 position:absolute;
 bottom:10px;
 right:10px;
 color:red;
 font-size:14px;
}
.flash{
 position:absolute;
 top:50%;left:50%;
 transform:translate(-50%,-50%);
 color:red;
 font-size:40px;
 display:none;
}

/* hover */
.pill{
 padding:5px;
 margin:5px;
 background:#fff;
 border-radius:10px;
 cursor:pointer;
 transition:.2s;
}
.pill:hover{
 transform:scale(1.1);
 background:var(--accent);
}
</style>
</head>

<body>

<!-- 星 -->
<script>
for(let i=0;i<50;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.animationDuration=(2+Math.random()*3)+"s";
 document.body.appendChild(s);
}
</script>

<div class="container">

<!-- 左 -->
<div class="side">
<h3>🦷めぽ情報</h3>
<p>堕メ天使VTuber 妄堕めぽ</p>
<p>配信 21:00〜</p>
</div>

<!-- メイン -->
<div class="main">

<h1>めぽのお部屋へようこそ⊂( ᴖ ̫ ᴖ )⊃</h1>

<!-- 配信 -->
<div class="window" id="liveWin" style="top:50px;left:50px;">
<div class="titlebar">Live.exe</div>
<div class="content">
<div id="live">準備中...</div>
</div>
</div>

<!-- BBS -->
<div class="window" id="bbsWin" style="top:200px;left:120px;">
<div class="titlebar">掲示板</div>
<div class="content">
<input id="name" placeholder="名前"><br>
<textarea id="msg"></textarea><br>
<button onclick="post()">書き込む</button>
<div id="bbs"></div>
</div>
</div>

<!-- グッズ -->
<div class="window" id="goodsWin" style="top:100px;left:400px;">
<div class="titlebar">Goods.exe</div>
<div class="content">
<div class="pill" onclick="gacha(event)">アクスタ</div>
<div class="pill" onclick="gacha(event)">アクキー</div>
</div>
</div>
</div>

</div>

<!-- 右 -->
<div class="side">
<h3>リンク</h3>
<a href="https://www.youtube.com/" target="_blank">YouTube</a>
</div>

</div>

<!-- 裏世界 -->
<div id="ura">
<div id="uraTime"></div>
<div class="flash" id="flash">堕ちろ</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
/* 🔥 Firebase（自分のに変更） */
const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 databaseURL:"YOUR_DB_URL"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* BBS */
function post(){
 let name=document.getElementById("name").value||"名無し";
 let msg=document.getElementById("msg").value;
 if(!msg)return;

 db.ref("bbs").push({name,msg});
 document.getElementById("msg").value="";
}

db.ref("bbs").limitToLast(20).on("value",s=>{
 let html="";
 let d=s.val();
 for(let k in d){
  html+=`<div>${d[k].name}: ${d[k].msg}</div>`;
 }
 bbs.innerHTML=html;
});

/* ガチャ */
function gacha(e){
 let r=document.createElement("div");
 r.className="effect";
 const items=["🐰","✨","🍰","🦷"];
 const rare=Math.random()<0.1?"💖":items[Math.floor(Math.random()*items.length)];
 r.innerHTML=rare;
 r.style.left=e.clientX+"px";
 r.style.top=e.clientY+"px";
 r.style.fontSize=rare==="💖"?"40px":"25px";
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),1000);
}

/* クリックでガチャ */
document.addEventListener("click",e=>{
 gacha(e);
});

/* ドラッグ */
function drag(el){
 let p1=0,p2=0,p3=0,p4=0;
 el.querySelector(".titlebar").onmousedown=e=>{
  p3=e.clientX;p4=e.clientY;
  document.onmousemove=e=>{
   p1=p3-e.clientX;p2=p4-e.clientY;
   p3=e.clientX;p4=e.clientY;
   el.style.top=(el.offsetTop-p2)+"px";
   el.style.left=(el.offsetLeft-p1)+"px";
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}
drag(liveWin);drag(bbsWin);drag(goodsWin);

/* ===================
   👿 裏世界
=================== */

let clickCount=0;
let timer;

document.addEventListener("mousedown",()=>{
 timer=setInterval(()=>{
  clickCount++;
  if(clickCount>60){
   enterUra();
   clearInterval(timer);
  }
 },100);
});

document.addEventListener("mouseup",()=>{
 clearInterval(timer);
 clickCount=0;
});

function enterUra(){
 document.getElementById("ura").style.display="block";
 document.querySelector(".container").style.display="none";

 setInterval(()=>{
  uraTime.innerText=new Date().toLocaleTimeString();
 },1000);

 setInterval(()=>{
  if(Math.random()<0.2){
   flash.style.display="block";
   setTimeout(()=>flash.style.display="none",100);
  }
 },2000);
}

/* ノイズ音 */
document.getElementById("ura").addEventListener("click",()=>{
 const ctx=new AudioContext();
 const o=ctx.createOscillator();
 const g=ctx.createGain();
 o.connect(g);g.connect(ctx.destination);
 o.type="square";
 o.frequency.value=100;
 g.gain.value=0.02;
 o.start();
 setTimeout(()=>o.stop(),50);
});
</script>

</body>
</html>
