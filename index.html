```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:"MS UI Gothic","MS Gothic",monospace;
  font-size:14px;
}

.desktop-screen{
  display:none;
  height:100vh;
  background: linear-gradient(to bottom,#87cefa,#b0e0ff,#e0ffff);
}

/* アイコン */
.icon{
  width:80px;
  text-align:center;
  color:white;
  cursor:move;
  position:absolute;
  user-select:none;
}

/* ウィンドウ */
.window{
  position:absolute;
  width:340px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  display:none;
}

.titlebar{
  background:linear-gradient(to right,#000080,#1084d0);
  color:white;
  padding:4px;
  display:flex;
  justify-content:space-between;
  cursor:move;
}

.content{
  padding:10px;
  height:300px;
  overflow:auto;
  background:#fff;
}

.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:40px;
  background:#c0c0c0;
  display:flex;
  align-items:center;
}

.start,.task-btn{
  margin:5px;
  padding:5px;
  border:2px solid #fff;
  cursor:pointer;
}

.clock{margin-left:auto;padding:5px;}

.start-menu{
  position:absolute;
  bottom:40px;
  left:5px;
  background:#c0c0c0;
  display:none;
}
</style>
</head>

<body>

<div id="boot" style="position:fixed;inset:0;background:black;color:lime;display:flex;align-items:center;justify-content:center;">
MepoOS v1.0 Loading...
</div>

<div class="desktop-screen" id="desktop">

<!-- アイコン -->
<div class="icon" id="icon-bbs" ondblclick="openWin(bbsWin)">掲示板</div>
<div class="icon" id="icon-yt" ondblclick="openWin(ytWin)">配信</div>
<div class="icon" id="icon-link" ondblclick="openWin(linkWin)">リンク</div>

<!-- BBS -->
<div class="window" id="bbsWin" style="top:80px;left:120px;">
<div class="titlebar">掲示板 <button onclick="closeWin(bbsWin)">×</button></div>
<div class="content">
<input id="nameInput" placeholder="名前"><br>
<textarea id="msgInput"></textarea><br>
<button onclick="post()">書き込む</button>
<div id="bbs"></div>
</div>
</div>

<!-- 配信 -->
<div class="window" id="ytWin" style="top:100px;left:400px;">
<div class="titlebar">配信 <button onclick="closeWin(ytWin)">×</button></div>
<div class="content">YouTubeなど</div>
</div>

<!-- リンク -->
<div class="window" id="linkWin" style="top:120px;left:250px;">
<div class="titlebar">リンク集 <button onclick="closeWin(linkWin)">×</button></div>
<div class="content">
<a href="https://youtube.com" target="_blank">YouTube</a><br>
<a href="https://google.com" target="_blank">Google</a>
</div>
</div>

<!-- タスクバー -->
<div class="taskbar">
<div class="start" onclick="toggleStart()">スタート</div>
<div class="task-btn" onclick="openWin(bbsWin)">掲示板</div>
<div class="task-btn" onclick="openWin(ytWin)">配信</div>
<div class="task-btn" onclick="openWin(linkWin)">リンク</div>
<div class="clock" id="clock"></div>
</div>

<div class="start-menu" id="startMenu">
<div onclick="openWin(bbsWin)">掲示板</div>
<div onclick="openWin(ytWin)">配信</div>
<div onclick="openWin(linkWin)">リンク</div>
</div>

</div>

<script>
/* 起動 */
setTimeout(()=>{
 boot.style.display="none";
 desktop.style.display="block";
 initIcons();
},1500);

/* ウィンドウ */
let topZ=1;
function openWin(el){el.style.display="block";el.style.zIndex=++topZ;}
function closeWin(el){el.style.display="none";}

/* 時計 */
setInterval(()=>{
 clock.innerHTML=new Date().toLocaleTimeString();
},1000);

/* スタート */
function toggleStart(){
 startMenu.style.display = startMenu.style.display==="block"?"none":"block";
}

/* BBS */
function post(){
 let name=nameInput.value||"名無し";
 let msg=msgInput.value;
 if(!msg)return;
 let div=document.createElement("div");
 div.innerText=name+"："+msg;
 bbs.prepend(div);
 msgInput.value="";
}

/* ===== アイコンドラッグ＋保存 ===== */

function initIcons(){
 const icons=document.querySelectorAll(".icon");

 icons.forEach((icon,i)=>{
   let saved=JSON.parse(localStorage.getItem(icon.id));

   if(saved){
     icon.style.left=saved.x+"px";
     icon.style.top=saved.y+"px";
   }else{
     icon.style.left="10px";
     icon.style.top=(10 + i*90)+"px";
   }

   dragIcon(icon);
 });
}

function dragIcon(el){
 let offsetX,offsetY;

 el.onmousedown=function(e){
   offsetX=e.clientX - el.offsetLeft;
   offsetY=e.clientY - el.offsetTop;

   document.onmousemove=function(e){
     el.style.left=(e.clientX-offsetX)+"px";
     el.style.top=(e.clientY-offsetY)+"px";
   };
 };

 document.onmouseup=function(){
   document.onmousemove=null;

   // 保存
   localStorage.setItem(el.id, JSON.stringify({
     x: el.offsetLeft,
     y: el.offsetTop
   }));
 };

 // ダブルクリック干渉防止
 el.ondragstart=()=>false;
}
</script>

</body>
</html>
