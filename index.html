<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋⊂( ᴖ ̫ ᴖ )⊃</title>

<style>
:root{
 --main:#7fe3ff;
 --accent:#ffb3da;
 --bg:#eaffff;
}

body{
 margin:0;
 font-family:"MS Gothic";
 background:linear-gradient(var(--bg),#bdefff);
 overflow:hidden;
}

.container{display:flex;height:100vh;}
.side{
 width:20%;
 padding:10px;
 background:rgba(255,255,255,0.3);
 backdrop-filter:blur(10px);
}
.main{width:60%;position:relative;}

/* ウィンドウ */
.window{
 position:absolute;
 width:320px;
 background:rgba(255,255,255,0.4);
 border:2px solid var(--main);
 border-radius:12px;
 box-shadow:0 0 15px var(--main);
}
.titlebar{
 background:linear-gradient(90deg,var(--main),var(--accent));
 padding:5px;
 cursor:move;
}
.content{
 padding:10px;
 max-height:500px;
 overflow:auto;
}

/* 星 */
.star{
 position:fixed;
 width:6px;height:6px;
 background:white;
 border-radius:50%;
 animation:fall linear infinite;
}
@keyframes fall{
 from{transform:translateY(-10vh);}
 to{transform:translateY(110vh);}
}

/* LIVE */
.live{
 color:red;
 font-weight:bold;
 animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0;}}

/* 💊 グッズ */
.pill-sheet{
 display:grid;
 grid-template-columns:repeat(3,60px);
 gap:10px;
 justify-content:center;
}
.pill{
 width:60px;height:30px;
 border-radius:20px;
 background:linear-gradient(#fff,#cdefff);
 position:relative;
 cursor:pointer;
 transition:0.2s;
}
.pill:hover{
 transform:scale(1.1) rotate(-2deg);
 box-shadow:0 0 15px var(--main);
}
.pill::before{
 content:"";
 position:absolute;
 width:50%;
 height:100%;
 background:var(--main);
 border-radius:20px 0 0 20px;
}
.pill span{
 position:absolute;
 width:100%;
 text-align:center;
 font-size:10px;
 top:8px;
}

/* 🐰 */
.rabbit{
 position:fixed;
 font-size:30px;
 pointer-events:none;
 animation:rabbit 1s forwards;
}
@keyframes rabbit{
 0%{opacity:0;transform:scale(.5)}
 30%{opacity:1;transform:scale(1.2)}
 100%{opacity:0;transform:translateY(-40px)}
}

/* 裏世界 */
#ura{
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 background:black;
 display:none;
 z-index:9999;
}
#uraTime{
 position:absolute;
 bottom:10px;
 right:10px;
 color:red;
}
.flash{
 position:absolute;
 top:50%;left:50%;
 transform:translate(-50%,-50%);
 color:red;
 font-size:40px;
 display:none;
}
</style>
</head>

<body>

<script>
/* 星 */
for(let i=0;i<50;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.animationDuration=(2+Math.random()*3)+"s";
 document.body.appendChild(s);
}
</script>

<div class="container">
<!--（HTML部分はそのままなので省略OK）-->
</div>

<!-- 裏世界 -->
<div id="ura">
<div id="uraTime"></div>
<div class="flash" id="flash">堕ちろ</div>
</div>

<script>

/* 🐰 */
function rabbit(x,y){
 let r=document.createElement("div");
 r.className="rabbit";
 r.innerHTML=["🐰","🩵","🦷"][Math.floor(Math.random()*3)];
 r.style.left=x+"px";
 r.style.top=y+"px";
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),1000);
}

document.addEventListener("click",e=>{
 rabbit(e.clientX,e.clientY);
});

/* カウンター */
const counterRef=db.ref("counter");
counterRef.transaction(c=>(c||0)+1);

counterRef.on("value",s=>{
 let c=s.val()||0;
 counter.innerHTML=`あなたは <b>${c}</b> 人目の訪問者`;

 if(c%100===0){
  kiri.innerHTML="🎉キリ番GET!!!🎉";
 }
});

/* ===== ドラッグ ===== */
function drag(el){
 let p1=0,p2=0,p3=0,p4=0;
 el.querySelector(".titlebar").onmousedown=e=>{
  p3=e.clientX;p4=e.clientY;
  document.onmousemove=e=>{
   p1=p3-e.clientX;p2=p4-e.clientY;
   p3=e.clientX;p4=e.clientY;
   el.style.top=(el.offsetTop-p2)+"px";
   el.style.left=(el.offsetLeft-p1)+"px";
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}
drag(liveWin);
drag(bbsWin);
drag(goodsWin);

/* ===== 裏世界 ===== */
let timer;

document.addEventListener("mousedown",()=>{
 timer=setTimeout(()=>{
  enterUra();
 },6000);
});

document.addEventListener("mouseup",()=>{
 clearTimeout(timer);
});

function enterUra(){
 document.getElementById("ura").style.display="block";
 document.querySelector(".container").style.display="none";

 setInterval(()=>{
  uraTime.innerText=new Date().toLocaleTimeString();
 },1000);

 setInterval(()=>{
  if(Math.random()<0.3){
   flash.style.display="block";
   setTimeout(()=>flash.style.display="none",120);
  }
 },2000);
}

/* ノイズ */
document.getElementById("ura").addEventListener("click",()=>{
 const ctx=new AudioContext();
 const o=ctx.createOscillator();
 const g=ctx.createGain();
 o.connect(g);g.connect(ctx.destination);
 o.frequency.value=120;
 g.gain.value=0.02;
 o.start();
 setTimeout(()=>o.stop(),50);
});

</script>

</body>
</html>
