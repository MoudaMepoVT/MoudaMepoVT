<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>めぽのお部屋</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:"MS Gothic","MS PGothic",monospace;
  font-size:14px;
  background-color:#ccffff;
  background-image:url("https://www.transparenttextures.com/patterns/stardust.png");
}

.container{display:flex;height:100vh;}
.side{width:20%;padding:10px;}
.main{width:60%;position:relative;}

.window{
  position:absolute;
  width:320px;
  background:#e0ffff;
  border:3px ridge #00ffff;
}

.titlebar{
  background:#0000cc;
  color:white;
  padding:5px;
  cursor:move;
  display:flex;
  justify-content:space-between;
}

.buttons span{
  margin-left:5px;
  cursor:pointer;
}

.content{padding:10px;max-height:320px;overflow:auto;}
.hidden{display:none;}

</style>
</head>

<body>

<div class="container">

<div class="side">
<h3>プロフィール</h3>
<p>堕天使VTuber めぽ</p>
</div>

<div class="main">
<h1>めぽのお部屋</h1>
<p id="clock"></p>

<div class="window" id="bbsWin" style="top:100px;left:100px;">
<div class="titlebar" ondblclick="maximize(bbsWin)">
掲示板
<div class="buttons">
<span onclick="minimize(bbsWin)">＿</span>
<span onclick="closeWin(bbsWin)">×</span>
</div>
</div>
<div class="content">
<input id="name"><br>
<textarea id="msg"></textarea><br>
<button onclick="post()">書き込む</button>
<div id="bbs"></div>
</div>
</div>

<div class="window" id="goodsWin" style="top:100px;left:450px;">
<div class="titlebar" ondblclick="maximize(goodsWin)">
グッズ
<div class="buttons">
<span onclick="minimize(goodsWin)">＿</span>
<span onclick="closeWin(goodsWin)">×</span>
</div>
</div>
<div class="content">
グッズ一覧
</div>
</div>

</div>

<div class="side">
<h3>リンク</h3>
</div>

</div>

<script>
let topZ=1;

function bringToFront(el){
 topZ++;
 el.style.zIndex=topZ;
}

function drag(el){
 let p1=0,p2=0,p3=0,p4=0;

 el.onmousedown=()=>bringToFront(el);

 el.querySelector(".titlebar").onmousedown=e=>{
  bringToFront(el);
  p3=e.clientX;p4=e.clientY;

  document.onmousemove=e=>{
   p1=p3-e.clientX;
   p2=p4-e.clientY;
   p3=e.clientX;p4=e.clientY;
   el.style.top=(el.offsetTop-p2)+"px";
   el.style.left=(el.offsetLeft-p1)+"px";
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}

/* 閉じる */
function closeWin(el){
 el.style.display="none";
}

/* 最小化 */
function minimize(el){
 el.querySelector(".content").classList.toggle("hidden");
}

/* 最大化 */
function maximize(el){
 if(!el.classList.contains("max")){
  el.dataset.top=el.style.top;
  el.dataset.left=el.style.left;
  el.dataset.width=el.style.width;
  el.dataset.height=el.style.height;

  el.style.top="0";
  el.style.left="0";
  el.style.width="100%";
  el.style.height="100%";
  el.classList.add("max");
 }else{
  el.style.top=el.dataset.top;
  el.style.left=el.dataset.left;
  el.style.width=el.dataset.width;
  el.style.height=el.dataset.height;
  el.classList.remove("max");
 }
}

/* 時計 */
function updateClock(){
 const now=new Date();
 clock.innerHTML=now.toLocaleString();
}
setInterval(updateClock,1000);
updateClock();

/* 掲示板 */
function post(){
 let name=document.getElementById("name").value||"名無し";
 let msg=document.getElementById("msg").value;
 if(!msg)return;
 let div=document.createElement("div");
 div.innerHTML="<b>"+name+"</b>:"+msg;
 bbs.prepend(div);
 document.getElementById("msg").value="";
}

/* 適用 */
drag(bbsWin);
drag(goodsWin);

</script>

</body>
</html>
