<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>めぽOS</title>

<style>
*{box-sizing:border-box;}

body{margin:0;font-family:"MS Gothic","MS PGothic",monospace;}

/* 起動画面 */
.boot{
  position:fixed;
  inset:0;
  background:#000;
  color:#0f0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:20px;
  z-index:9999;
}

/* デスクトップ */
.desktop-screen{
  display:none;
  height:100vh;
  background:url("https://i.imgur.com/9QZ6K6R.jpg") center/cover;
}

.desktop{position:absolute;top:10px;left:10px;}
.icon{width:80px;text-align:center;color:white;margin-bottom:20px;cursor:pointer;}
.icon img{width:48px;display:block;margin:auto;}

.window{position:absolute;width:320px;background:#e0ffff;border:2px solid #000;display:none;}
.titlebar{background:linear-gradient(to right,#000080,#1084d0);color:white;padding:4px;cursor:move;display:flex;justify-content:space-between;font-size:12px;}
.buttons span{margin-left:4px;background:#c0c0c0;border:1px solid #000;padding:0 4px;cursor:pointer;}
.content{padding:10px;background:white;}

.taskbar{position:fixed;bottom:0;width:100%;height:40px;background:#c0c0c0;display:flex;align-items:center;}
.start{background:#c0c0c0;border:2px outset #fff;padding:5px 10px;margin:5px;cursor:pointer;}
.start-menu{position:absolute;bottom:40px;left:5px;width:160px;background:#c0c0c0;border:2px outset #fff;display:none;}
.start-menu div{padding:5px;cursor:pointer;}
.start-menu div:hover{background:#000080;color:white;}

.task-btn{margin-left:5px;padding:3px 8px;background:#e0e0e0;border:2px outset #fff;cursor:pointer;}
.clock{margin-left:auto;padding:5px;}

</style>
</head>

<body>

<!-- 起動画面 -->
<div class="boot" id="boot">
<p>Starting MepoOS...</p>
<p>Loading system...</p>
</div>

<!-- デスクトップ -->
<div class="desktop-screen" id="desktop">

<div class="desktop">
<div class="icon" ondblclick="openWin(bbsWin)">
<img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png">
掲示板
</div>
<div class="icon" ondblclick="openWin(goodsWin)">
<img src="https://cdn-icons-png.flaticon.com/512/1041/1041885.png">
グッズ
</div>
<div class="icon" onclick="trash()">
<img src="https://cdn-icons-png.flaticon.com/512/3096/3096673.png">
ゴミ箱
</div>
</div>

<div class="window" id="bbsWin" style="top:80px;left:120px;">
<div class="titlebar" ondblclick="maximize(bbsWin)">
掲示板
<div class="buttons">
<span onclick="minimize(bbsWin)">＿</span>
<span onclick="closeWin(bbsWin)">×</span>
</div>
</div>
<div class="content">掲示板内容</div>
</div>

<div class="window" id="goodsWin" style="top:120px;left:420px;">
<div class="titlebar" ondblclick="maximize(goodsWin)">
グッズ
<div class="buttons">
<span onclick="minimize(goodsWin)">＿</span>
<span onclick="closeWin(goodsWin)">×</span>
</div>
</div>
<div class="content">グッズ一覧</div>
</div>

<div class="taskbar">
<div class="start" onclick="toggleStart()">スタート</div>
<div class="task-btn" onclick="restoreWin(bbsWin)">掲示板</div>
<div class="task-btn" onclick="restoreWin(goodsWin)">グッズ</div>
<div class="clock" id="clock"></div>
</div>

<div class="start-menu" id="startMenu">
<div onclick="openWin(bbsWin)">掲示板</div>
<div onclick="openWin(goodsWin)">グッズ</div>
<div onclick="shutdown()">シャットダウン</div>
</div>

</div>

<script>
let topZ=1;

/* 起動処理 */
setTimeout(()=>{
 document.getElementById("boot").style.display="none";
 document.getElementById("desktop").style.display="block";
},2000);

function bringToFront(el){topZ++;el.style.zIndex=topZ;}

function drag(el){
 let p1=0,p2=0,p3=0,p4=0;
 el.onmousedown=()=>bringToFront(el);
 el.querySelector(".titlebar").onmousedown=e=>{
  bringToFront(el);
  p3=e.clientX;p4=e.clientY;
  document.onmousemove=e=>{
   p1=p3-e.clientX;p2=p4-e.clientY;
   p3=e.clientX;p4=e.clientY;
   el.style.top=(el.offsetTop-p2)+"px";
   el.style.left=(el.offsetLeft-p1)+"px";
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}

function openWin(el){el.style.display="block";bringToFront(el);} 
function closeWin(el){el.style.display="none";} 
function minimize(el){el.style.display="none";} 
function restoreWin(el){el.style.display="block";bringToFront(el);} 

function maximize(el){
 if(!el.classList.contains("max")){
  el.dataset.top=el.style.top;
  el.dataset.left=el.style.left;
  el.style.top="0";
  el.style.left="0";
  el.style.width="100%";
  el.style.height="calc(100% - 40px)";
  el.classList.add("max");
 }else{
  el.style.top=el.dataset.top;
  el.style.left=el.dataset.left;
  el.style.width="320px";
  el.style.height="auto";
  el.classList.remove("max");
 }
}

function toggleStart(){
 let m=document.getElementById("startMenu");
 m.style.display = (m.style.display==="block") ? "none" : "block";
}

function shutdown(){
 document.getElementById("desktop").style.display="none";
 document.getElementById("boot").style.display="flex";
 document.getElementById("boot").innerHTML="<p>Shutting down...</p>";
}

function trash(){
 alert("ゴミ箱は空です");
}

function updateClock(){clock.innerHTML=new Date().toLocaleTimeString();}
setInterval(updateClock,1000);
updateClock();

/* 適用 */
drag(bbsWin);
drag(goodsWin);

</script>

</body>
</html>
