<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋</title>

<style>
:root{
  --main:#7fe3ff;
  --sub:#c8f7ff;
  --accent:#ffb3da;
  --bg:#eaffff;
}

body{
  margin:0;
  font-family:"MS Gothic";
  background:linear-gradient(var(--bg),#bdefff);
  overflow:hidden;
}

/* レイアウト */
.container{display:flex;height:100vh;}
.side{
  width:20%;
  padding:10px;
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(10px);
}
.main{width:60%;position:relative;}

/* ウィンドウ */
.window{
  position:absolute;
  width:320px;
  background:rgba(255,255,255,0.4);
  border:2px solid var(--main);
  border-radius:12px;
  box-shadow:0 0 20px var(--main);
  backdrop-filter:blur(12px);
  transition:0.2s;
}
.window:hover{
  transform:scale(1.02);
}
.titlebar{
  background:linear-gradient(90deg,var(--main),var(--accent));
  padding:5px;
  cursor:move;
}
.content{
  padding:10px;
  max-height:320px;
  overflow:auto;
}

/* ✨ 星強化 */
.star{
  position:fixed;
  width:6px;height:6px;
  background:white;
  border-radius:50%;
  filter:blur(1px);
  box-shadow:0 0 10px white;
  animation:fall linear infinite;
}
@keyframes fall{
  from{transform:translateY(-10vh);}
  to{transform:translateY(110vh);}
}

/* 🐰 キャラ */
.character{
  position:fixed;
  right:20px;
  bottom:0;
  width:200px;
  animation:float 3s infinite;
}
@keyframes float{
  50%{transform:translateY(-15px);}
}

/* LIVE */
.live{
  color:red;
  font-weight:bold;
  animation:blink 1s infinite;
}
@keyframes blink{
  50%{opacity:0;}
}

/* 💊 グッズ */
.pill-sheet{
  display:grid;
  grid-template-columns:repeat(3,60px);
  gap:10px;
  justify-content:center;
}
.pill{
  width:60px;height:30px;
  border-radius:20px;
  background:linear-gradient(#fff,#cdefff);
  position:relative;
  cursor:pointer;
  transition:0.2s;
}
.pill:hover{
  transform:scale(1.1) rotate(-2deg);
  box-shadow:0 0 15px var(--main);
}
.pill::before{
  content:"";
  position:absolute;
  width:50%;
  height:100%;
  background:var(--main);
  border-radius:20px 0 0 20px;
}
.pill span{
  position:absolute;
  width:100%;
  text-align:center;
  font-size:10px;
  top:8px;
}

/* 🐰 エフェクト */
.rabbit{
  position:fixed;
  pointer-events:none;
  animation:rabbit 1s forwards;
}
@keyframes rabbit{
  0%{opacity:0;transform:scale(.5)}
  30%{opacity:1;transform:scale(1.3)}
  100%{opacity:0;transform:translateY(-50px)}
}

/* 💬 BBS */
.bbs-post{
  background:rgba(255,255,255,0.6);
  border-radius:10px;
  margin-bottom:5px;
  padding:8px;
  font-size:12px;
}
</style>
</head>

<body>

<script>
/* ✨ 星 */
for(let i=0;i<40;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.animationDuration=(2+Math.random()*3)+"s";
 document.body.appendChild(s);
}
</script>

<div class="container">

<div class="side">
<p>🦷めぽ情報🌧</p>
<p>堕メ天使の妄堕めぽ</p>
</div>

<div class="main">

<div class="window" id="bbsWin" style="top:120px;left:120px;">
<div class="titlebar">掲示板</div>
<div class="content">
<input id="name" placeholder="名前"><br>
<textarea id="msg"></textarea><br>
<button onclick="post()">書き込む</button>
<div id="bbs"></div>
</div>
</div>

<div class="window" style="top:60px;left:400px;">
<div class="titlebar">グッズ</div>
<div class="content">
<div class="pill-sheet">
<div class="pill" onclick="buy(event)"><span>アクスタ</span></div>
<div class="pill" onclick="buy(event)"><span>アクキー</span></div>
<div class="pill" onclick="buy(event)"><span>バッヂ</span></div>
</div>
</div>
</div>

</div>
</div>

<img class="character" src="https://via.placeholder.com/200">

<script>
/* 🔒 XSS対策 */
function escapeHTML(str){
 return str.replace(/[&<>"']/g, m => ({
  "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
 }[m]));
}

/* 💬 ダミーBBS */
function post(){
 let name=document.getElementById("name").value||"名無し";
 let msg=document.getElementById("msg").value;
 if(!msg)return;

 let html=`
 <div class="bbs-post">
 💬 <b>${escapeHTML(name)}</b><br>
 ${escapeHTML(msg)}
 </div>`;

 bbs.innerHTML=html+bbs.innerHTML;

 rabbit(window.innerWidth/2,window.innerHeight/2);
 document.getElementById("msg").value="";
}

/* 🐰 クリックガチャ */
function rabbit(x,y){
 let r=document.createElement("div");
 r.className="rabbit";

 const items=["🐰","🩵","🦷","✨","🍰"];
 const rare=Math.random()<0.1 ? "💖" : items[Math.floor(Math.random()*items.length)];

 r.innerHTML=rare;
 r.style.left=x+"px";
 r.style.top=y+"px";
 r.style.fontSize = rare==="💖" ? "40px" : "26px";

 document.body.appendChild(r);
 setTimeout(()=>r.remove(),1000);
}

document.addEventListener("click",e=>{
 rabbit(e.clientX,e.clientY);
});

/* 💊 */
function buy(e){
 rabbit(e.clientX,e.clientY);
}

/* 🪟 ドラッグ */
function drag(el){
 let p1=0,p2=0,p3=0,p4=0;
 el.querySelector(".titlebar").onmousedown=e=>{
  p3=e.clientX;p4=e.clientY;
  document.onmousemove=e=>{
   p1=p3-e.clientX;p2=p4-e.clientY;
   p3=e.clientX;p4=e.clientY;
   el.style.top=(el.offsetTop-p2)+"px";
   el.style.left=(el.offsetLeft-p1)+"px";
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}
drag(bbsWin);
</script>

</body>
</html>
