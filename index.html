<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>めぽOS</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:"MS Gothic","MS PGothic",monospace;
  background:#008080; /* デスクトップ色 */
}

.container{position:relative;height:100vh;}

/* ウィンドウ */
.window{
  position:absolute;
  width:320px;
  background:#e0ffff;
  border:3px ridge #00ffff;
}

.titlebar{
  background:#0000cc;
  color:white;
  padding:5px;
  cursor:move;
  display:flex;
  justify-content:space-between;
}

.buttons span{
  margin-left:5px;
  cursor:pointer;
}

.content{padding:10px;max-height:300px;overflow:auto;}
.hidden{display:none;}

/* タスクバー */
.taskbar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:40px;
  background:#c0c0c0;
  border-top:3px ridge #fff;
  display:flex;
  align-items:center;
  padding:5px;
}

.task-btn{
  margin-right:5px;
  padding:3px 8px;
  background:#e0e0e0;
  border:2px outset #fff;
  cursor:pointer;
}

.clock{
  margin-left:auto;
}

</style>
</head>

<body>

<div class="container">

<!-- ウィンドウ1 -->
<div class="window" id="bbsWin" style="top:50px;left:50px;">
<div class="titlebar" ondblclick="maximize(bbsWin)">
掲示板
<div class="buttons">
<span onclick="minimize(bbsWin)">＿</span>
<span onclick="closeWin(bbsWin)">×</span>
</div>
</div>
<div class="content">
<input id="name"><br>
<textarea id="msg"></textarea><br>
<button onclick="post()">書き込む</button>
<div id="bbs"></div>
</div>
</div>

<!-- ウィンドウ2 -->
<div class="window" id="goodsWin" style="top:80px;left:400px;">
<div class="titlebar" ondblclick="maximize(goodsWin)">
グッズ
<div class="buttons">
<span onclick="minimize(goodsWin)">＿</span>
<span onclick="closeWin(goodsWin)">×</span>
</div>
</div>
<div class="content">グッズ一覧</div>
</div>

</div>

<!-- タスクバー -->
<div class="taskbar">
<div class="task-btn" onclick="restoreWin(bbsWin)">掲示板</div>
<div class="task-btn" onclick="restoreWin(goodsWin)">グッズ</div>
<div class="clock" id="clock"></div>
</div>

<script>
let topZ=1;

function bringToFront(el){
 topZ++;
 el.style.zIndex=topZ;
}

function drag(el){
 let p1=0,p2=0,p3=0,p4=0;

 el.onmousedown=()=>bringToFront(el);

 el.querySelector(".titlebar").onmousedown=e=>{
  bringToFront(el);
  p3=e.clientX;p4=e.clientY;

  document.onmousemove=e=>{
   p1=p3-e.clientX;
   p2=p4-e.clientY;
   p3=e.clientX;p4=e.clientY;
   el.style.top=(el.offsetTop-p2)+"px";
   el.style.left=(el.offsetLeft-p1)+"px";
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}

function closeWin(el){
 el.style.display="none";
}

function minimize(el){
 el.style.display="none";
}

function restoreWin(el){
 el.style.display="block";
 bringToFront(el);
}

function maximize(el){
 if(!el.classList.contains("max")){
  el.dataset.top=el.style.top;
  el.dataset.left=el.style.left;
  el.style.top="0";
  el.style.left="0";
  el.style.width="100%";
  el.style.height="calc(100% - 40px)";
  el.classList.add("max");
 }else{
  el.style.top=el.dataset.top;
  el.style.left=el.dataset.left;
  el.style.width="320px";
  el.style.height="auto";
  el.classList.remove("max");
 }
}

function updateClock(){
 clock.innerHTML=new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

function post(){
 let name=document.getElementById("name").value||"名無し";
 let msg=document.getElementById("msg").value;
 if(!msg)return;
 let div=document.createElement("div");
 div.innerHTML="<b>"+name+"</b>:"+msg;
 bbs.prepend(div);
 document.getElementById("msg").value="";
}

/* 適用 */
drag(bbsWin);
drag(goodsWin);

</script>

</body>
</html>
