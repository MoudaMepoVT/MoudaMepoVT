<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋⊂( ᴖ ̫ ᴖ )⊃</title>

<style>
body{
 margin:0;
 font-family:"MS Gothic";
 background:linear-gradient(#eaffff,#bdefff);
 overflow:hidden;
}

.container{display:flex;height:100vh;}
.side{
 width:20%;
 padding:10px;
 background:rgba(255,255,255,0.3);
 backdrop-filter:blur(10px);
}
.main{width:60%;position:relative;}

.window{
 position:absolute;
 width:320px;
 background:rgba(255,255,255,0.4);
 border:2px solid #7fe3ff;
 border-radius:12px;
 box-shadow:0 0 15px #7fe3ff;
}
.titlebar{
 background:linear-gradient(90deg,#7fe3ff,#ffb3da);
 padding:5px;
 cursor:move;
}
.content{padding:10px;max-height:400px;overflow:auto;}

.star{
 position:fixed;
 width:6px;height:6px;
 background:white;
 border-radius:50%;
 animation:fall linear infinite;
}
@keyframes fall{
 from{transform:translateY(-10vh);}
 to{transform:translateY(110vh);}
}

.rabbit{
 position:fixed;
 font-size:28px;
 pointer-events:none;
 animation:rabbit 1s forwards;
}
@keyframes rabbit{
 0%{opacity:0;transform:scale(.5)}
 30%{opacity:1;transform:scale(1.2)}
 100%{opacity:0;transform:translateY(-40px)}
}

#ura{
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 background:black;
 display:none;
 z-index:9999;
}
#uraTime{
 position:absolute;
 bottom:10px;
 right:10px;
 color:red;
}
.flash{
 position:absolute;
 top:50%;left:50%;
 transform:translate(-50%,-50%);
 color:red;
 font-size:40px;
 display:none;
}
</style>
</head>

<body>

<!-- 星 -->
<script>
for(let i=0;i<50;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.animationDuration=(2+Math.random()*3)+"s";
 document.body.appendChild(s);
}
</script>

<div class="container">

<!-- 左 -->
<div class="side">
<p>🦷めぽ情報🌧</p>
<p>堕メ天使VTuber 妄堕めぽ</p>
<hr>
<p id="counter"></p>
</div>

<!-- メイン -->
<div class="main">

<div class="window" id="liveWin" style="top:40px;left:40px;">
<div class="titlebar">配信情報</div>
<div class="content">
<div id="live"></div>
</div>
</div>

<div class="window" id="bbsWin" style="top:200px;left:100px;">
<div class="titlebar">掲示板</div>
<div class="content">
<input id="name" placeholder="名前"><br>
<textarea id="msg"></textarea><br>
<button onclick="post()">書き込む</button>
<div id="bbs"></div>
</div>
</div>

</div>

<!-- 右 -->
<div class="side">
<h2>リンク</h2>
<a href="https://www.youtube.com/@妄堕めぽ-MoudaMepo" target="_blank">YouTube</a>
</div>

</div>

<!-- 裏世界 -->
<div id="ura">
<div id="uraTime"></div>
<div id="flash" class="flash">堕ちろ</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

/* ===== Firebase ===== */
const firebaseConfig={
 apiKey:"ここに自分のAPIキー",
 databaseURL:"ここにDB URL"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* カウンター */
const counterRef=db.ref("counter");
counterRef.transaction(c=>(c||0)+1);
counterRef.on("value",s=>{
 counter.innerHTML=`訪問者 ${s.val()||0}`;
});

/* BBS */
function post(){
 let name=nameInput.value||"名無し";
 let msg=msgInput.value;
 if(!msg)return;

 db.ref("bbs").push({name,msg});
 msgInput.value="";
}
const nameInput=document.getElementById("name");
const msgInput=document.getElementById("msg");

db.ref("bbs").limitToLast(20).on("value",s=>{
 let html="";
 let d=s.val();
 for(let k in d){
  html=`<div>${d[k].name}:${d[k].msg}</div>`+html;
 }
 bbs.innerHTML=html;
});

/* 🐰 */
function rabbit(x,y){
 let r=document.createElement("div");
 r.className="rabbit";
 r.innerHTML=["🐰","🩵","🦷"][Math.floor(Math.random()*3)];
 r.style.left=x+"px;
 r.style.top=y+"px;
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),1000);
}
document.addEventListener("click",e=>{
 rabbit(e.clientX,e.clientY);
});

/* ドラッグ */
function drag(el){
 let x=0,y=0;
 el.querySelector(".titlebar").onmousedown=e=>{
  x=e.clientX;y=e.clientY;
  document.onmousemove=e=>{
   el.style.left=(el.offsetLeft+(e.clientX-x))+"px";
   el.style.top=(el.offsetTop+(e.clientY-y))+"px";
   x=e.clientX;y=e.clientY;
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}
drag(liveWin);
drag(bbsWin);

/* ===== 裏世界 ===== */
let timer;

document.addEventListener("mousedown",()=>{
 timer=setTimeout(()=>enterUra(),2000);
});
document.addEventListener("mouseup",()=>{
 clearTimeout(timer);
});

function enterUra(){
 ura.style.display="block";
 document.querySelector(".container").style.display="none";

 setInterval(()=>{
  uraTime.innerText=new Date().toLocaleTimeString();
 },1000);

 setInterval(()=>{
  if(Math.random()<0.3){
   flash.style.display="block";
   setTimeout(()=>flash.style.display="none",100);
  }
 },2000);
}

/* ノイズ */
ura.addEventListener("click",()=>{
 const ctx=new AudioContext();
 const o=ctx.createOscillator();
 const g=ctx.createGain();
 o.connect(g);g.connect(ctx.destination);
 o.frequency.value=120;
 g.gain.value=0.02;
 o.start();
 setTimeout(()=>o.stop(),50);
});

</script>

</body>
</html>
