<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:"MS UI Gothic";font-size:18px;}

.desktop-screen{
  display:none;
  height:100vh;
  background: linear-gradient(to bottom,#87cefa,#b0e0ff,#e0ffff);
}

/* アイコン */
.desktop{position:absolute;top:20px;left:20px;}
.icon{width:100px;text-align:center;color:white;margin-bottom:20px;cursor:pointer;}

/* ウィンドウ */
.window{
  position:absolute;
  width:500px;
  height:400px;
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  display:none;
}

.titlebar{
  background:linear-gradient(to right,#000080,#1084d0);
  color:white;
  padding:5px;
  display:flex;
  justify-content:space-between;
  cursor:move;
}

.content{
  background:white;
  height:calc(100% - 30px);
  overflow:auto;
  padding:10px;
}

.resizer{
  width:12px;height:12px;
  background:#404040;
  position:absolute;
  right:0;bottom:0;
  cursor:nwse-resize;
}

/* ★ お知らせウィンドウ（常時） */
.notice{
  position:fixed;
  right:20px;
  bottom:90px;
  width:260px;
  height:200px; /* ←高さ固定がポイント */
  background:#c0c0c0;
  border:2px solid #fff;
  border-right-color:#404040;
  border-bottom-color:#404040;
  z-index:9999;

  display:flex;           
  flex-direction:column;  
}

.notice .titlebar{
  cursor:move;
}

.notice .content{
  flex:1;        /* ←ここ重要 */
  overflow:auto; /* ←中だけスクロール */
}

/* タスクバー */
.taskbar{
  position:fixed;bottom:0;width:100%;height:50px;
  background:#c0c0c0;display:flex;align-items:center;
}

.task-btn{
  margin-left:5px;
  padding:5px;
  border:2px solid #fff;
  cursor:pointer;
}

.link-btn{
  margin-left:10px;
  padding:5px;
  border:2px solid #fff;
  cursor:pointer;
}

.clock{
  margin-left:auto;
  padding:5px;
  text-align:right;
  line-height:1.2;
  font-size:14px;
}

.maximized{
  top:0!important;left:0!important;
  width:100%!important;
  height:calc(100vh - 50px)!important;
}
</style>
</head>

<body>

<div id="boot" style="position:fixed;inset:0;background:black;color:lime;display:flex;align-items:center;justify-content:center;">
MepoOS Loading...
</div>

<div id="desktop" class="desktop-screen">

<!-- アイコン -->
<div class="desktop">
<div class="icon" ondblclick="openWin(bbsWin)">📄<br>掲示板</div>
<div class="icon" ondblclick="openWin(ytWin)">📺<br>配信</div>
</div>

<!-- BBS -->
<div class="window" id="bbsWin" style="top:100px;left:100px;">
<div class="titlebar">
<span>掲示板</span>
<div>
<button onclick="minWin(this)">＿</button>
<button onclick="maxWin(this)">□</button>
<button onclick="closeWin(this)">×</button>
</div>
</div>
<div class="content">掲示板だよ</div>
<div class="resizer"></div>
</div>

<!-- YouTube -->
<div class="window" id="ytWin" style="top:120px;left:500px;">
<div class="titlebar">
<span id="ytTitle">配信</span>
<div>
<button onclick="minWin(this)">＿</button>
<button onclick="maxWin(this)">□</button>
<button onclick="closeWin(this)">×</button>
</div>
</div>
<div class="content">
<h3 id="liveLabel">LIVE</h3>
<div id="player"></div>
<div id="live"></div>
</div>
<div class="resizer"></div>
</div>

<!-- ★ お知らせ -->
<div class="notice" id="noticeWin">
<div class="titlebar">📢 お知らせ</div>
<div class="content">
<p>ようこそ めぽるーむへ！</p>
<p>🔴 配信が始まるとここに表示されるよ</p>
<p><a href="https://www.youtube.com/" target="_blank">▶ YouTube</a></p>
</div>
</div>

<!-- タスクバー -->
<div class="taskbar">
<div class="task-btn" onclick="openWin(bbsWin)">掲示板</div>
<div class="task-btn" onclick="openWin(ytWin)">配信</div>

<!-- 追加リンク -->
<div class="link-btn" onclick="window.open('https://www.youtube.com/@%E5%A6%84%E5%A0%95%E3%82%81%E3%81%BD-MoudaMepo')">YouTube</div>
<div class="link-btn" onclick="window.open('https://x.com/hello_mepo')">ツイッター</div>

<!-- 日時 -->
<div class="clock" id="clock"></div>
</div>

</div>

<script>
setTimeout(()=>{boot.style.display="none";desktop.style.display="block";},1500);

/* 時計（日時） */
function updateClock(){
 const now=new Date();
 const date=now.toLocaleDateString();
 const time=now.toLocaleTimeString();
 clock.innerHTML=date+"<br>"+time;
}
setInterval(updateClock,1000);
updateClock();

/* ウィンドウ */
let topZ=1;
function openWin(win){win.style.display="block";win.style.zIndex=++topZ;}
function closeWin(btn){btn.closest(".window").style.display="none";}
function minWin(btn){btn.closest(".window").style.display="none";}

function maxWin(btn){
 const win=btn.closest(".window");
 if(!win.classList.contains("maximized")){
  win.dataset.t=win.style.top;
  win.dataset.l=win.style.left;
  win.dataset.w=win.style.width;
  win.dataset.h=win.style.height;
  win.classList.add("maximized");
 }else{
  win.classList.remove("maximized");
  win.style.top=win.dataset.t;
  win.style.left=win.dataset.l;
  win.style.width=win.dataset.w;
  win.style.height=win.dataset.h;
 }
}

/* ドラッグ */
document.querySelectorAll(".window, .notice").forEach(win=>{
 const bar=win.querySelector(".titlebar");
 let drag=false,ox,oy;

 bar.onmousedown=e=>{
  drag=true;
  ox=e.clientX-win.offsetLeft;
  oy=e.clientY-win.offsetTop;
 };

 document.onmousemove=e=>{
  if(drag){
    win.style.left=e.clientX-ox+"px";
    win.style.top=e.clientY-oy+"px";
  }
 };

 document.onmouseup=()=>drag=false;
});

/* LIVE検知（軽量） */
const API_KEY="AIzaSyCWEQ1J0mEq8EFo7Cw5UYHpGRhYbC0Tu88";
const CHANNEL_ID="UCmUlzug_w0WqRdTsEMJHjFw";

async function checkLive(){
 try{
  const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`);
  const d=await r.json();

  if(d.items && d.items.length){
    const id=d.items[0].id.videoId;
    player.innerHTML=`<iframe width="100%" height="260"
    src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1"></iframe>`;
    liveLabel.innerText="🔴 LIVE中";

    noticeWin.querySelector(".content").innerHTML =
      "🔴 配信中！<br><a href='https://youtube.com/watch?v="+id+"' target='_blank'>今すぐ見る</a>";

  }else{
    liveLabel.innerText="配信なし";
  }

 }catch(e){}
}
setInterval(checkLive,30000);
checkLive();
</script>

</body>
</html>
