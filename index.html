
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>めぽOS 完全版</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:"MS Gothic";}

/* デスクトップ */
.desktop-screen{
  display:none;
  height:100vh;
  background:#0000AA;
  color:white;
}

/* アイコン */
.desktop{position:absolute;top:10px;left:10px;}
.icon{width:80px;text-align:center;color:white;margin-bottom:20px;cursor:pointer;}
.icon img{width:48px;display:block;margin:auto;}

/* ウィンドウ */
.window{
  position:absolute;
  width:340px;
  background:#0000AA;
  border:2px solid white;
  display:none;
}

.titlebar{
  background:#0000AA;
  padding:4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:move;
  border-bottom:1px solid white;
}

.titlebar button{
  margin-left:5px;
  cursor:pointer;
}

.content{
  padding:10px;
  height:300px;
  overflow:auto;
}

/* タスクバー */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:40px;
  background:#0000AA;
  border-top:1px solid white;
  display:flex;
  align-items:center;
}

.start{margin:5px;border:1px solid white;padding:5px;cursor:pointer;}
.task-btn{margin-left:5px;border:1px solid white;padding:3px 8px;cursor:pointer;}
.clock{margin-left:auto;padding:5px;}

/* スタートメニュー */
.start-menu{
  position:absolute;
  bottom:40px;
  left:5px;
  background:#0000AA;
  border:1px solid white;
  display:none;
}
.start-menu div{padding:5px;cursor:pointer;}
.start-menu div:hover{background:white;color:#0000AA;}

/* テロップ */
.ticker{
  position:fixed;
  bottom:40px;
  width:100%;
  background:#0000AA;
  color:white;
  overflow:hidden;
  border-top:1px solid white;
}
.ticker-text{
  display:inline-block;
  white-space:nowrap;
  padding-left:100%;
  animation:scroll 15s linear infinite;
}
@keyframes scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* LIVE点滅 */
.live{
  color:red;
  font-weight:bold;
  animation:blink 1s infinite;
}
@keyframes blink{
  50%{opacity:0;}
}
</style>
</head>

<body>

<!-- 起動 -->
<div id="boot" style="position:fixed;inset:0;background:black;color:lime;display:flex;align-items:center;justify-content:center;">
Starting MepoOS...
</div>

<div class="desktop-screen" id="desktop">

<!-- アイコン -->
<div class="desktop">
<div class="icon" ondblclick="openWin(bbsWin)">掲示板</div>
<div class="icon" ondblclick="openWin(ytWin)">YouTube</div>
<div class="icon" ondblclick="openWin(imgWin)">画像</div>
</div>

<!-- BBS -->
<div class="window" id="bbsWin" style="top:80px;left:120px;">
<div class="titlebar">
<span>掲示板</span>
<span class="win-clock"></span>
<div>
<button onclick="maximizeWin(bbsWin)">□</button>
<button onclick="closeWin(bbsWin)">×</button>
</div>
</div>
<div class="content">
<input id="nameInput" placeholder="名前"><br>
<textarea id="msgInput"></textarea><br>
<button onclick="post()">書き込む</button>
<div id="bbs"></div>
</div>
</div>

<!-- YouTube -->
<div class="window" id="ytWin" style="top:100px;left:400px;">
<div class="titlebar">
<span>YouTube</span>
<span class="win-clock"></span>
<div>
<button onclick="maximizeWin(ytWin)">□</button>
<button onclick="closeWin(ytWin)">×</button>
</div>
</div>
<div class="content">
<h2>★配信情報★</h2>

<h3>🔴 LIVE中</h3>
<div id="live"></div>

<h3>⏰ 配信予定</h3>
<div id="upcoming"></div>

<h3>📼 アーカイブ</h3>
<div id="archive"></div>
</div>
</div>

<!-- 画像 -->
<div class="window" id="imgWin" style="top:150px;left:700px;">
<div class="titlebar">
<span>画像ビューア</span>
<span class="win-clock"></span>
<div>
<button onclick="maximizeWin(imgWin)">□</button>
<button onclick="closeWin(imgWin)">×</button>
</div>
</div>
<div class="content">
<img src="https://via.placeholder.com/250" width="100%">
</div>
</div>

<!-- テロップ -->
<div class="ticker">
<div class="ticker-text">
★お知らせ：めぽOS完全版！掲示板・配信・ウィンドウ機能すべて実装！
</div>
</div>

<!-- タスクバー -->
<div class="taskbar">
<div class="start" onclick="toggleStart()">スタート</div>
<div class="task-btn" onclick="openWin(bbsWin)">掲示板</div>
<div class="task-btn" onclick="openWin(ytWin)">YouTube</div>
<div class="task-btn" onclick="openWin(imgWin)">画像</div>
<div class="clock" id="clock"></div>
</div>

<div class="start-menu" id="startMenu">
<div onclick="openWin(bbsWin)">掲示板</div>
<div onclick="openWin(ytWin)">YouTube</div>
<div onclick="openWin(imgWin)">画像</div>
</div>

</div>

<script>
/* 起動 */
setTimeout(()=>{
 boot.style.display="none";
 desktop.style.display="block";
},1500);

/* 前面 */
let topZ=1;
function bringToFront(el){topZ++;el.style.zIndex=topZ;}
function openWin(el){el.style.display="block";bringToFront(el);}
function closeWin(el){el.style.display="none";}

/* 最大化 */
function maximizeWin(el){
 if(el.classList.contains("max")){
  el.classList.remove("max");
  el.style.width="340px";
  el.style.height="";
 }else{
  el.classList.add("max");
  el.style.top="0";
  el.style.left="0";
  el.style.width="100vw";
  el.style.height="calc(100vh - 40px)";
 }
}

/* ドラッグ */
function drag(el){
 el.querySelector(".titlebar").onmousedown=e=>{
  let x=e.clientX,y=e.clientY;
  document.onmousemove=e=>{
   el.style.top=(el.offsetTop+(e.clientY-y))+"px";
   el.style.left=(el.offsetLeft+(e.clientX-x))+"px";
   x=e.clientX;y=e.clientY;
  };
 };
 document.onmouseup=()=>document.onmousemove=null;
}
drag(bbsWin);drag(ytWin);drag(imgWin);

/* 時計 */
setInterval(()=>{
 let t=new Date().toLocaleTimeString();
 clock.innerHTML=t;
 document.querySelectorAll(".win-clock").forEach(e=>e.innerHTML=t);
},1000);

/* スタート */
function toggleStart(){
 startMenu.style.display = startMenu.style.display==="block"?"none":"block";
}

/* BBS（ローカル簡易） */
function post(){
 let name=nameInput.value||"名無し";
 let msg=msgInput.value;
 if(!msg)return;
 let div=document.createElement("div");
 div.innerText=name+"："+msg;
 bbs.prepend(div);
 msgInput.value="";
}

/* YouTube */
const API_KEY="AIzaSyCWEQ1J0mEq8EFo7Cw5UYHpGRhYbC0Tu88";
const CHANNEL_ID="UCmUlzug_w0WqRdTsEMJHjFw";

async function loadYT(type,target){
 try{
  const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=${type}&type=video&key=${API_KEY}`);
  const data=await res.json();

  let html="";
  if(!data.items||data.items.length===0){
    html="なし";
  }else{
    data.items.forEach(item=>{
      html+=`
      <div>
      ${type==="live" ? '<p class="live">🔴 LIVE中！！！</p>' : ""}
      <img src="${item.snippet.thumbnails.medium.url}" width="200"><br>
      ${item.snippet.title}<br>
      <a href="https://youtube.com/watch?v=${item.id.videoId}" target="_blank">▶ 見に行く！</a>
      </div><hr>`;
    });
  }

  document.getElementById(target).innerHTML=html;
 }catch(e){
  document.getElementById(target).innerHTML="読み込み失敗";
 }
}

loadYT("live","live");
loadYT("upcoming","upcoming");
loadYT("completed","archive");
</script>

</body>
</html>
