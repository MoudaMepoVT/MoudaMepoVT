<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>妄堕めぽのお部屋</title>

<style>
:root{
  --main:#7fe3ff;
  --accent:#ffb3da;
  --bg:#eaffff;
}

body{
  margin:0;
  font-family:"MS Gothic";
  background:linear-gradient(var(--bg),#bdefff);
  overflow:hidden;
}

.container{display:flex;height:100vh;}
.side{
  width:20%;
  padding:10px;
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(10px);
  font-size:13px;
}
.main{width:60%;position:relative;}

/* ウィンドウ */
.window{
  position:absolute;
  width:320px;
  background:rgba(255,255,255,0.4);
  border:2px solid var(--main);
  border-radius:12px;
  box-shadow:0 0 20px var(--main);
  backdrop-filter:blur(12px);
  transition:0.2s;
}
.window:hover{transform:scale(1.02);}
.titlebar{
  background:linear-gradient(90deg,var(--main),var(--accent));
  padding:5px;
  cursor:move;
}
.content{
  padding:10px;
  max-height:320px;
  overflow:auto;
}

/* 星 */
.star{
  position:fixed;
  width:6px;height:6px;
  background:white;
  border-radius:50%;
  filter:blur(1px);
  box-shadow:0 0 10px white;
  animation:fall linear infinite;
}
@keyframes fall{
  from{transform:translateY(-10vh);}
  to{transform:translateY(110vh);}
}

/* LIVE */
.live{
  color:red;
  font-weight:bold;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0;}}

/* グッズ */
.pill{
  width:60px;height:30px;
  border-radius:20px;
  background:linear-gradient(#fff,#cdefff);
  position:relative;
  cursor:pointer;
  transition:0.2s;
  margin:5px;
}
.pill:hover{
  transform:scale(1.1) rotate(-2deg);
  box-shadow:0 0 15px var(--main);
}
.pill span{
  position:absolute;
  width:100%;
  text-align:center;
  font-size:10px;
  top:8px;
}

/* BBS */
.bbs-post{
  background:rgba(255,255,255,0.6);
  border-radius:10px;
  margin-bottom:5px;
  padding:8px;
  font-size:12px;
}

/* エフェクト */
.rabbit{
  position:fixed;
  pointer-events:none;
  animation:rabbit 1s forwards;
}
@keyframes rabbit{
  0%{opacity:0;transform:scale(.5)}
  30%{opacity:1;transform:scale(1.3)}
  100%{opacity:0;transform:translateY(-50px)}
}
</style>
</head>

<body>

 s.style.animationDuration=(2+Math.random()*3)+"s";
 document.body.appendChild(s);
}
</script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
/* Firebase */
const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 databaseURL:"YOUR_DB_URL"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* カウンター */
const counterRef=db.ref("counter");
counterRef.transaction(c=>(c||0)+1);

counterRef.on("value",s=>{
 let c=s.val()||0;
 counter.innerHTML=`あなたは <b>${c}</b> 人目の訪問者`;
 if(c%100===0){
  kiri.innerHTML="🎉キリ番GET!!!🎉";
 }
});

/* XSS対策 */
function escapeHTML(str){
 return str.replace(/[&<>"']/g, m => ({
  "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
 }[m]));
}

/* BBS */
function post(){
 let name=nameInput.value||"名無し";
 let msg=msgInput.value;
 if(!msg)return;

 db.ref("bbs").push({
  name:name,
  msg:msg,
  time:new Date().toLocaleString()
 });

 msgInput.value="";
 rabbit(window.innerWidth/2,window.innerHeight/2);
}

const nameInput=document.getElementById("name");
const msgInput=document.getElementById("msg");

db.ref("bbs").limitToLast(20).on("value",s=>{
 let html="";
 let d=s.val();
 for(let k in d){
  let p=d[k];
  html=`<div class="bbs-post">
  💬 <b>${escapeHTML(p.name)}</b><br>
  ${escapeHTML(p.msg)}
  </div>`+html;
 }
 bbs.innerHTML=html;
});

/* YouTube */
const API_KEY="YOUR_YOUTUBE_KEY";
const CHANNEL_ID="UCmUlzug_w0WqRdTsEMJHjFw";

async function loadYT(){
 try{
  let res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&order=date&type=video&maxResults=6&key=${API_KEY}`);
  let data=await res.json();

  let html="";
  data.items.forEach(v=>{
    html+=`<div>
    <img src="${v.snippet.thumbnails.medium.url}" width="200"><br>
    ${escapeHTML(v.snippet.title)}
    </div><hr>`;
  });

  archive.innerHTML=html;

 }catch{
  archive.innerHTML="読み込み失敗";
 }
}
loadYT();

/* ガチャ */
function rabbit(x,y){
 let r=document.createElement("div");
 r.className="rabbit";
 const items=["🐰","✨","🍰","🦷"];
 const rare=Math.random()<0.1?"💖":items[Math.floor(Math.random()*items.length)];
 r.innerHTML=rare;
 r.style.left=x+"px";
 r.style.top=y+"px";
 r.style.fontSize=rare==="💖"?"40px":"26px";
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),1000);
}

document.addEventListener("click",e=>{
 rabbit(e.clientX,e.clientY);
});

function buy(e){
 rabbit(e.clientX,e.clientY);
}
</script>
